  QUEUE_TYPE_OFFLINE = 1;
  QUEUE_TYPE_INBOUND_CALL = 2;
  QUEUE_TYPE_IVR_CALL = 3;
  QUEUE_TYPE_PREVIEW_CALL = 4;
  QUEUE_TYPE_PROGRESSIVE_CALL = 5;
  QUEUE_TYPE_PREDICTIVE_CALL = 6;
  QUEUE_TYPE_INBOUND_CHAT = 7;
  QUEUE_TYPE_AGENT_TASK = 8;
  QUEUE_TYPE_OUTBOUND_TASK = 9;
  QUEUE_TYPE_INBOUND_IM = 10;
  QUEUE_TYPE_OUTBOUND_CALL = 11;
