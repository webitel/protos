  repeated string cause = 15;
  google.protobuf.BoolValue has_file = 16;

  int64 domain_id = 17;
  string number = 18;
  string direction = 19;
  FilterBetween answered_at = 20;
  bool missed = 21;
  FilterBetween stored_at = 22;
  repeated string id = 23;
