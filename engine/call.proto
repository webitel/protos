// A single completed call leg (CDR record) with its queue, agent, media,
// evaluation and transfer context.
//
// Terminology: "Leg A" is the top-level (parent) call; "Leg B" is a child leg
// created by bridging or transferring (`parent_id` is set).
// All timestamps are Unix epoch MILLISECONDS (UTC); all `*_sec` fields are
// durations in SECONDS. All fields are output-only.
message HistoryCall {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "HistoryCall"
        description: "Completed call leg (CDR) enriched with queue, agent, recording, transcript, evaluation and transfer information. Timestamps are Unix epoch milliseconds (UTC); durations are seconds."
      }
      example: "{\"id\": \"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\",  \"direction\": \"inbound\", \"destination\": \"0800123456\", \"created_at\": 1790676900000, \"answered_at\": 1790676903000, \"bridged_at\": 1790676905000, \"hangup_at\": 1790677020000, \"hangup_by\": \"A\", \"cause\": \"NORMAL_CLEARING\", \"duration\": 120, \"wait_sec\": 3, \"bill_sec\": 117, \"talk_sec\": 115}"
    };

  // Blind transfer record.
  message BlindTransfer {

    // Destination number the call was blind-transferred to.
    string number = 1 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"1002\""}
    ];

    // Time of the transfer, Unix epoch milliseconds (UTC).
    int64 time = 2 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676960000"}
    ];

    // User who initiated the blind transfer.
    Lookup user = 3;
  }


  // Media quality statistics (RTP/RTCP) of the call session.
  // Each metric has avg/min/max values and the offsets (from call start) at
  // which the min/max occurred.
  message QualityMetrics {
    // Unique SIP session identifier the statistics belong to.
    string sip_id = 1;

    // Mean Opinion Score (MOS): voice quality estimate, scale 1.0 (bad) to 5.0 (excellent).
    float mos_avg = 2 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "4.3"}
    ];

    // Minimum MOS during the call.
    float mos_min = 3 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "3.8"}
    ];

    // Maximum MOS during the call.
    float mos_max = 4 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "4.4"}
    ];

    // Offset (seconds from call start) of the minimum MOS.
    int32 mos_min_at = 5 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "42"}
    ];

    // Offset (seconds from call start) of the maximum MOS.
    int32 mos_max_at = 6 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "5"}
    ];

    // Jitter: packet delay variation, in milliseconds. Average value.
    float jitter_avg = 7 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "6.2"}
    ];

    // Minimum jitter (ms).
    float jitter_min = 8 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1.1"}
    ];

    // Maximum jitter (ms).
    float jitter_max = 9 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "23.5"}
    ];

    // Offset (seconds from call start) of the minimum jitter.
    int32 jitter_min_at = 10 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "12"}
    ];

    // Offset (seconds from call start) of the maximum jitter.
    int32 jitter_max_at = 11 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "77"}
    ];

    // Packet loss: percentage of lost RTP packets. Average value.
    float packetloss_avg = 12 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "0.4"}
    ];

    // Minimum packet loss (%).
    float packetloss_min = 13 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "0"}
    ];

    // Maximum packet loss (%).
    float packetloss_max = 14 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "2.1"}
    ];

    // Offset (seconds from call start) of the minimum packet loss.
    int32 packetloss_min_at = 15 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "3"}
    ];

    // Offset (seconds from call start) of the maximum packet loss.
    int32 packetloss_max_at = 16 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "90"}
    ];

    // Round Trip Time (RTT): signal round-trip delay, in milliseconds. Average value.
    float roundtrip_avg = 17 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "48.7"}
    ];

    // Minimum RTT (ms).
    float roundtrip_min = 18 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "31.0"}
    ];

    // Maximum RTT (ms).
    float roundtrip_max = 19 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "120.3"}
    ];

    // Offset (seconds from call start) of the minimum RTT.
    int32 roundtrip_min_at = 20 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "8"}
    ];

    // Offset (seconds from call start) of the maximum RTT.
    int32 roundtrip_max_at = 21 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "64"}
    ];
  }

  // Unique call (leg) identifier.
  string id = 1 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid" example: "\"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\""}
  ];

  // Identifier of the application/node that handled the call.
  string app_id = 2 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"call-center-node-01\""}
  ];

  // Record type. Always `call` for this resource.
  string type = 3 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"call\""}
  ];

  // ID of the parent leg (Leg A). Empty for a top-level call.
  string parent_id = 4 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid" example: "\"7a1d2c44-9f30-4f0b-8c6e-1b2a3c4d5e6f\""}
  ];

  // // User (operator) on this leg; falls back to the queue agent's user if the leg has no direct user.
  Lookup user = 5;

  // SIP extension of the user. For agent-driven queue types the agent's extension is used.
  string extension = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"1001\""}];

  // SIP gateway (trunk) used by the leg.
  Lookup gateway = 7;

  // Call direction: `inbound` or `outbound`.
  string direction = 8 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"inbound\""}
  ];

  // Dialed destination number (DID or dialed digits).
  string destination = 9 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"0800123456\""}
  ];

  // Caller endpoint (type, number, id, name).
  Endpoint from = 10;

  // Callee endpoint (type, number, id, name).
  Endpoint to = 11;

  // Custom call variables (channel payload) set by the dialplan, flow, API or integrations.
  map<string, string> variables = 12 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "{\"campaign\": \"autumn_sale\"}"}
  ];

  // Call creation time (Unix epoch ms, UTC).
  int64 created_at = 13 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676900000"}
  ];

  // Time the call was answered (Unix epoch ms, UTC). 0 if never answered.
  int64 answered_at = 14 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676903000"}
  ];

  // Time the leg was bridged to the other party (Unix epoch ms, UTC). 0 if never bridged.
  int64 bridged_at = 15 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676905000"}
  ];

  // Hangup time (Unix epoch ms, UTC).
  int64 hangup_at = 16 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790677020000"}
  ];

  // Party that terminated the call: `A` = caller, `B` = callee, `F` = terminated by the platform (mapped to disposition `ended`).
  string hangup_by = 17;

  // Hangup cause (Q.850/FreeSWITCH style).
  string cause = 18 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"NORMAL_CLEARING\""}
  ];

  // Total duration in seconds (hangup - creation), including ringing and wait.
  int32 duration = 19 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "120"}
  ];

  // Total hold time in seconds.
  int32 hold_sec = 20 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "4"}
  ];

  // Wait time in seconds: creation to answer (or to hangup if never answered).
  int32 wait_sec = 21 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "3"}
  ];

  // Billable seconds: answer to hangup. 0 if never answered.
  int32 bill_sec = 22 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "117"}
  ];

  // Final SIP response code of the leg.
  int32 sip_code = 23 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "200"}
  ];

  // Recordings and other files attached to this call or to its parent call.
  repeated CallFile files = 24;

  // Queue the call was processed in.
  Lookup queue = 25;

  // Queue member associated with the call.
  Lookup member = 26;

  // Team of the handling agent.
  Lookup team = 27;

  // Agent who handled the queue attempt.
  Lookup agent = 28;

  // Time the call joined the queue (Unix epoch ms, UTC).
  int64 joined_at = 29 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676901000"}
  ];

  // Time the call left the queue (Unix epoch ms, UTC).
  int64 leaving_at = 30 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790677020000"}
  ];

  // Time the agent finished post-call reporting/wrap-up (Unix epoch ms, UTC).
  int64 reporting_at = 31 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790677050000"}
  ];

  // Time the call was bridged to the agent within the queue (Unix epoch ms, UTC).
  int64 queue_bridged_at = 32 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790676905000"}
  ];

  // Time in queue before being bridged (or before leaving if never bridged), seconds.
  int32 queue_wait_sec = 33 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "119"}
  ];

  // Total time spent in the queue (leaving - joined), seconds.
  int32 queue_duration_sec = 34 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "30"}
  ];

  // Post-call reporting (wrap-up) time in seconds. 0 if no reporting occurred.
  int32 reporting_sec = 35 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "30"}
  ];

  // Queue attempt result (disposition set by the system or the agent).
  string result = 36 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"success\""}
  ];

  // Tags assigned to the call.
  repeated string tags = 37 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "[\"vip\"]"}
  ];

  // Display label/number of the queue member for this attempt.
  string display = 38 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"380501234567\""}
  ];

  // Time the record was persisted to history (Unix epoch ms, UTC).
  int64 stored_at = 39 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790677030000"}
  ];

  // ID of the call this leg was transferred from. Empty if not a transfer.
  string transfer_from = 40 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid" example: "\"7a1d2c44-9f30-4f0b-8c6e-1b2a3c4d5e6f\""}
  ];

  // ID of the call this leg was transferred to. For child legs without an explicit value, derived from the parent's bridged leg.
  string transfer_to = 41 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid" example: "\"b3c4d5e6-1a2b-4c3d-8e9f-0a1b2c3d4e5f\""}
  ];

  // True if the call has child legs (Leg B) or blind-transfer legs.
  bool has_children = 42 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "true"}
  ];

  // Agent's wrap-up note for the queue attempt (leading/trailing whitespace trimmed).
  string agent_description = 43 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Customer asked for a callback tomorrow\""}
  ];

  // Hold intervals of this call and its child legs, ordered by start time.
  repeated CallHold hold = 44;

  // Operator annotations (notes on recording segments), newest first.
  repeated CallAnnotation annotations = 45;

  // Answering machine detection result (classic AMD, falls back to AI AMD).
  string amd_result = 46;

    // Derived call outcome. One of: empty (child leg), `not_answered`, `cancelled`, `ended`, `agent_dropped`, `client_dropped`, `error`.
  string hangup_disposition = 47 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"client_dropped\""}
  ];

  // Destination number of a blind transfer performed on this call. Empty if none.
  string blind_transfer = 48 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"1002\""}
  ];

  // Background jobs (e.g. transcription, retention, upload) related to the call's files.
  repeated HistoryFileJob files_job = 49;

  // Available transcripts of the call recording.
  repeated TranscriptLookup transcripts = 50;

  // Talk time in seconds: the time parties were connected, excluding ringing and hold.
  int32 talk_sec = 51 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "115"}
  ];

  // Grantee (authorization subject) the call was placed on behalf of.
  Lookup grantee = 52;

  // AI-based answering machine detection result.
  string amd_ai_result = 53 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"human\""}
  ];

  // Diagnostic logs produced by the AI answering machine detection.
  repeated string amd_ai_logs = 54 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "[\"greeting detected\"]"}
  ];

  // ID of the quality evaluation (audit rate) of this call. 0 if not evaluated.
  int64 rate_id = 55 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "3021"}
  ];

  // User who was evaluated.
  Lookup rated_user = 56;

  // User (supervisor/QA) who performed the evaluation.
  Lookup rated_by = 57;

  // Evaluation score of optional questions.
  float score_optional = 58 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "85.5"}
  ];

  // Evaluation score of required (mandatory) questions.
  float score_required = 59 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "92.0"}
  ];

  // ID of the queue attempt linked to this call.
  int64 attempt_id = 60 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "550012"}
  ];

  // True if the call can currently be evaluated (answered queue call, or a bridged leg without transfers involving a user).
  bool allow_evaluation = 61 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "true"}
