    int32 top = 5;
    bool desc = 6;
  }

  string name = 1;
  repeated Group group = 2;

  repeated string min = 3;
  repeated string max = 4;
  repeated string sum = 5;
  repeated string avg = 6;
  repeated string count = 7;
  repeated string sort = 8;
  int32 limit = 9;
}

message AggregateHistoryCallRequest {
  int32 page = 1;
