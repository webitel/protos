syntax = "proto3";

package engine;

import "const.proto";
import "google/api/annotations.proto";
import "google/api/visibility.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "queue_domain.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/webitel/protos/engine";

// CallService provides a comprehensive set of operations for managing
// real-time telephony and analyzing historical call data.
service CallService {
    // SearchHistoryCall retrieves a list of completed calls using filters (GET).
    // Supports advanced filtering by participants, duration, causes, and custom variables.
  rpc SearchHistoryCall(SearchHistoryCallRequest) returns (ListHistoryCall) {
    option (google.api.http) = {get: "/calls/history"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Search call history (GET)"
      description: "Returns a page of completed calls (CDR). Filters are passed as query parameters and are AND-combined; array filters are repeated query parameters combined with OR. Timestamps are Unix epoch milliseconds (UTC); ranges are inclusive. Results are limited to the caller's domain and to calls visible under RBAC (own calls, supervised users, permitted queues and groups). Use the POST variant for large filter sets."
      tags: "Call History"
    };
  }

  // SearchHistoryCallPost retrieves a list of completed calls using a complex filter body (POST).
  // Ideal for large filter sets that exceed URL length limits.
  rpc SearchHistoryCallPost(SearchHistoryCallRequest) returns (ListHistoryCall) {
    option (google.api.http) = {
      post: "/calls/history"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Search call history (POST)"
      description: "Same semantics as the GET variant, but filters are sent in the JSON body. Recommended for large ID lists, variables maps and other filter sets that may exceed URL length limits."
      tags: "Call History"
    };
  }

  // PatchHistoryCall updates metadata for a completed call (e.g., variables or visibility).
  rpc PatchHistoryCall(PatchHistoryCallRequest) returns (HistoryCall) {
    option (google.api.http) = {
      patch: "/calls/history/{id}"
      body: "*"
    };
  }

  // AggregateHistoryCall performs statistical analysis on historical data.
  // Group and aggregate metrics like average duration, call counts, or peak hours.
  rpc AggregateHistoryCall(AggregateHistoryCallRequest) returns (ListAggregate) {
    option (google.api.http) = {
      post: "/calls/history/aggregate"
      body: "*"
    };
  }

  // PatchHistoryCallAttempt performs update of history attempt binded to call.
  rpc PatchHistoryCallAttempt(PatchHistoryCallAttemptRequest) returns (PatchHistoryCallAttemptResponse) {
    option (google.api.http) = {
      patch: "/calls/history/{id}/attempt"
      body: "*"
    };
  }

  // --- Active Calls ---

  // SearchActiveCall returns a list of all calls currently in progress.
  rpc SearchActiveCall(SearchCallRequest) returns (ListCall) {
    option (google.api.http) = {get: "/calls/active"};
  }

  // ReadCall returns detailed real-time information for a specific active call.
  rpc ReadCall(ReadCallRequest) returns (ActiveCall) {
    option (google.api.http) = {get: "/calls/active/{id}"};
  }

  // CreateCall initiates a new outbound call with specified parameters.
  rpc CreateCall(CreateCallRequest) returns (CreateCallResponse) {
    option (google.api.http) = {
      post: "/calls"
      body: "*"
    };
  }

  // CreateCallNA is an internal version of CreateCall without API annotation.
  rpc CreateCallNA(CreateCallRequest) returns (CreateCallResponse) {}

  // HangupCall terminates an active call session.
  rpc HangupCall(HangupCallRequest) returns (HangupCallResponse) {
    option (google.api.http) = {
      delete: "/calls/active/{id}"
      body: "*"
    };
  }

  // --- Call Control ---

  // HoldCall puts an active call on hold.
  rpc HoldCall(UserCallRequest) returns (HoldCallResponse) {
    option (google.api.http) = {
      patch: "/calls/active/{id}/hold"
      body: "*"
    };
  }

  // UnHoldCall resumes a call from hold state.
  rpc UnHoldCall(UserCallRequest) returns (HoldCallResponse) {
    option (google.api.http) = {
      patch: "/calls/active/{id}/unhold"
      body: "*"
    };
  }

  // DtmfCall sends DTMF digits to an active call.
  rpc DtmfCall(DtmfCallRequest) returns (DtmfCallResponse) {
    option (google.api.http) = {
      patch: "/calls/active/{id}/dtmf"
      body: "*"
    };
  }

  // BlindTransferCall redirects an active call to another destination.
  rpc BlindTransferCall(BlindTransferCallRequest) returns (BlindTransferCallResponse) {
    option (google.api.http) = {
      patch: "/calls/active/{id}/transfer"
      body: "*"
    };
  }

  // EavesdropCall allows a supervisor to listen, whisper, or join an active call.
  rpc EavesdropCall(EavesdropCallRequest) returns (CreateCallResponse) {
    option (google.api.http) = {
      post: "/calls/active/{id}/eavesdrop"
      body: "*"
    };
  }

  // ConfirmPush confirms receipt of a push notification for synchronization.
  rpc ConfirmPush(ConfirmPushRequest) returns (ConfirmPushResponse) {
    option (google.api.http) = {patch: "/calls/active/{id}/confirm_push"};
  }

  rpc SetVariablesCallNA(SetVariablesCallRequestNA) returns (SetVariablesCallResponse) {}

  // SetVariablesCall updates call channel variables in real-time.
  rpc SetVariablesCall(SetVariablesCallRequest) returns (SetVariablesCallResponse) {
    option (google.api.http) = {
      patch: "/calls/active/{id}/variables"
      body: "*"
    };
  }

  // CreateCallAnnotation adds a text note to a specific timeframe of a historical call.
  rpc CreateCallAnnotation(CreateCallAnnotationRequest) returns (CallAnnotation) {
    option (google.api.http) = {
      post: "/calls/history/{call_id}/annotation"
      body: "*"
    };
  }

  // UpdateCallAnnotation modifies an existing call note.
  rpc UpdateCallAnnotation(UpdateCallAnnotationRequest) returns (CallAnnotation) {
    option (google.api.http) = {
      put: "/calls/history/{call_id}/annotation/{id}"
      body: "*"
    };
  }

  // DeleteCallAnnotation removes an annotation from a historical call.
  rpc DeleteCallAnnotation(DeleteCallAnnotationRequest) returns (CallAnnotation) {
    option (google.api.http) = {delete: "/calls/history/{call_id}/annotation/{id}"};
  }

  // RedialCall quickly initiates a new call using data from a previous history record.
  rpc RedialCall(RedialCallRequest) returns (CreateCallResponse) {
    option (google.api.http) = {
      post: "/calls/history/{call_id}/redial"
      body: "*"
    };
  }
}

message RedialCallRequest {
  string call_id = 1;
}

message PatchHistoryCallRequest {
  string id = 1;
  map<string, string> variables = 2;
  google.protobuf.BoolValue hide_missed = 3;
}

message SetVariablesCallRequest {
  string id = 1;
  map<string, string> variables = 2;
}

message SetVariablesCallRequestNA {
  string id = 1;
  int64 domain_id = 2;
  map<string, string> variables = 3;
}

message SetVariablesCallResponse {}

message ConfirmPushRequest {
  string id = 1;
}

message ConfirmPushResponse {}

// Search request for the call history store.
//
// One of CreatedAt, StoredAt, Number, Q, DependencyID or ID filters are required
// others are optional.
// All filters are combined with logical AND. Array filters us OR logic between their elements.
// Results are always restricted to the caller`s domain and to calls calls visible to the caller under
// RBAC rules (own calls, supervised users, permitted queues and groups).
//
// Time conventions: every timestamp/range is Unix epoch in MILLISECONDS (UTC).
// Every FilterBetween range is INCLUSIVE on both bounds (from <= value <= to).
message SearchHistoryCallRequest {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "SearchHistoryCallRequest"
        description: "Filter, sort and pagination parameters for searching completed calls (CDR). Filters are AND-combined; array filters are OR-combined internally. Timestamps are Unix epoch milliseconds (UTC); ranges are inclusive."
      }
      example: "{\"page\": 1, \"size\": 20, \"sort\": \"-created_at\", \"created_at\": {\"from\": 1790640000000, \"to\": 1790726399999}, \"direction\": \"inbound\", \"queue_id\": [12], \"missed\": true}"
    };

  // Page number (1-based).
  int32 page = 1 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Page number, 1-based. Combined with `size` to compute the offset. If omitted or 0, the first page is returned. The response field `next` indicates whether another page exists."
        example: "1"
        minimum: 1
      }
  ];

  // Page size.
  int32 size = 2 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Maximum number of calls returned per page. If omitted or 0, the server default page size is used (40); server maximum supported limit is 20000."
        example: "20"
        minimum: 1
      }
  ];

  // Free-text search.
  string q = 3 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Quick search. Case-insensitive pattern match (ILIKE) against the dialed destination, the caller number (from_number) and the callee number (to_number), OR an exact match against the call ID (UUID). If omitted or empty, no text filtering is applied."
        example: "\"380441234567\""
      }
  ];

  // Sort expression.
  string sort = 4 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Sort expression: a response field name, optionally prefixed with `-` for descending order (e.g. `-created_at`). If omitted, the server default ordering is used (newest first)."
        example: "\"-created_at\""
      }
  ];

  // Response field projection.
  repeated string fields = 5 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Response field projection: names of HistoryCall fields to return. If omitted or empty, all fields are returned. Requesting fewer fields reduces payload size and query cost."
        example: "[\"id\", \"created_at\", \"duration\", \"queue\", \"agent\"]"
      }
  ];

  // Call creation time range.
  FilterBetween created_at = 6 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on call creation time (`created_at`), Unix epoch milliseconds (UTC). Either bound may be omitted for an open-ended range. Strongly recommended for performance on large datasets."
        example: "{\"from\": 1790640000000, \"to\": 1790726399999}"
      }
  ];

  // Users (operators) on any leg.
  repeated int64 user_id = 7 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of user IDs (OR logic). Matches calls where the user is the owner of the leg (`user_id`) OR participated in any leg of the call (`user_ids`). Use `owner_id` to match the leg owner only. Empty array = no filter."
        example: "[101, 102]"
      }
  ];

  // Agents.
  repeated int64 agent_id = 8 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of agent IDs (OR logic). Matches calls handled by at least one of the given agents on any leg (`agent_ids`). Empty array = no filter."
        example: "[45]"
      }
  ];

  // Queues.
  repeated int64 queue_id = 9 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of queue IDs (OR logic). Matches calls whose leg queue (`queue_id`) or any queue the call passed through (`queue_ids`) is in the list. Empty array = no filter."
        example: "[12, 13]"
      }
  ];

  // Teams.
  repeated int64 team_id = 10 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of team IDs (OR logic). Matches calls whose leg team (`team_id`) or any team involved in the call (`team_ids`) is in the list. Empty array = no filter."
        example: "[3]"
      }
  ];

  // Dialer members.
  repeated int64 member_id = 11 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of queue member (contact/lead) IDs (OR logic). Exact match on the call's `member_id`. Empty array = no filter."
        example: "[900123]"
      }
  ];

  // SIP gateways (trunks).
  repeated int64 gateway_id = 12 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of SIP gateway (trunk) IDs (OR logic). Matches calls whose leg gateway (`gateway_id`) or any gateway used in the call (`gateway_ids`) is in the list. Empty array = no filter."
        example: "[7]"
      }
  ];

  // Total call duration range.
  FilterBetween duration = 13 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on total call duration in SECONDS (hangup time minus creation time, includes ringing/wait). A bound that is omitted or 0 is ignored."
        example: "{\"from\": 30, \"to\": 600}"
      }
  ];

  // Hide child legs.
  bool skip_parent = 14 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "If true, only top-level calls (Leg A, `parent_id` is null) are returned and child legs (Leg B) are hidden. If false or omitted, all legs are returned."
        example: "true"
      }
  ];

  // Parent call.
  string parent_id = 15 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Exact match on the parent call ID. Returns the direct child legs (Leg B) of the given call. If omitted or empty, no filter is applied."
        format: "uuid"
        example: "\"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\""
      }
  ];

  // Hangup causes.
  repeated string cause = 16 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of hangup causes (OR logic), exact match on `cause` (e.g. NORMAL_CLEARING, USER_BUSY, NO_ANSWER, ORIGINATOR_CANCEL). Empty array = no filter."
        example: "[\"NORMAL_CLEARING\", \"NO_ANSWER\"]"
      }
  ];

  // Has recordings/files.
  google.protobuf.BoolValue has_file = 17 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Tri-state filter by attached files (recordings, screen captures). true = only calls that have files; false = only calls without files; omitted/null = no filter."
        example: "true"
      }
  ];

  // Domain.
  int64 domain_id = 18 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Tenant (domain) ID. Normally derived from the caller's authentication context; the server always restricts results to the caller's domain."
        example: "1"
      }
  ];

  // Phone number (regexp).
  string number = 19 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Phone number search. The value is converted to a regular expression and matched (`~`) against the pre-computed search number, or against destination, from_number and to_number when it is not available. Matches the number on either side of the call. If omitted or empty, no filter is applied."
        example: "\"380441234567\""
      }
  ];

  // Direction.
  string direction = 20 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Call direction, exact match: `inbound` or `outbound`. If omitted or empty, both directions are returned."
        example: "\"inbound\""
      }
  ];

  // Answer time range.
  FilterBetween answered_at = 21 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on answer time (`answered_at`), Unix epoch milliseconds (UTC). IMPORTANT: applied only when BOTH `from` and `to` are provided; otherwise ignored. Unanswered calls are excluded when active."
        example: "{\"from\": 1790640000000, \"to\": 1790726399999}"
      }
  ];

  // Missed inbound calls.
  bool missed = 22 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "If true, returns only missed calls: inbound, never bridged to an operator (`bridged_at` is null), not hidden from the missed list, and whose parent call was not bridged. Omit for no filter; do not send an explicit false."
        example: "true"
      }
  ];

  // Storage time range.
  FilterBetween stored_at = 23 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on the time the call record was persisted to history (`stored_at`), Unix epoch milliseconds (UTC). IMPORTANT: applied only when BOTH `from` and `to` are provided; otherwise ignored. Useful for incremental synchronization."
        example: "{\"from\": 1790640000000, \"to\": 1790726399999}"
      }
  ];

  // Call IDs.
  repeated string id = 24 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of call IDs (UUID, OR logic). Exact match on `id`. Empty array = no filter."
        example: "[\"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\"]"
      }
  ];

  // Transfer source calls.
  repeated string transfer_from = 25 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of call IDs (UUID, OR logic). Returns calls that were created by a transfer FROM one of the given calls (`transfer_from`). Empty array = no filter."
        example: "[\"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\"]"
      }
  ];

  // Transfer target calls.
  repeated string transfer_to = 26 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of call IDs (UUID, OR logic). Returns calls that were transferred TO one of the given calls (`transfer_to`). Empty array = no filter."
        example: "[\"7a1d2c44-9f30-4f0b-8c6e-1b2a3c4d5e6f\"]"
      }
  ];

  // Dependency root.
  string dependency_id = 27 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Root call ID (UUID). Returns the full dependency tree of the call: all descendants reachable recursively through `parent_id` (child legs) or `transfer_from` (transfers). The root call itself is excluded. Required when `timeline` is true. If omitted, no filter is applied."
        format: "uuid"
        example: "\"0e6f8f3a-5b1c-4c1e-9a55-3f0f2b6c9d10\""
      }
  ];

  // Tags.
  repeated string tags = 28 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of tags (OR logic). Matches calls having at least one of the given tags (array overlap). Empty array = no filter."
        example: "[\"vip\", \"complaint\"]"
      }
  ];

  // Channel variables.
  map<string, string> variables = 29 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Custom call variables filter. Matches calls whose stored variables (JSONB payload) contain ALL given key/value pairs (containment, AND logic between pairs; exact, case-sensitive values). Empty map = no filter."
        example: "{\"campaign\": \"autumn_sale\", \"lang\": \"uk\"}"
      }
  ];

  // AMD results.
  repeated string amd_result = 30 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of answering machine detection (AMD) results (OR logic). Matches either the classic AMD result or the AI AMD result. Passing an empty string element (\"\") additionally matches calls without a detection result. Empty array = no filter."
        example: "[\"HUMAN\", \"MACHINE\"]"
      }
  ];

  // Transcript full-text search.
  string fts = 31 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Full-text search over call transcripts (PostgreSQL plainto_tsquery semantics: all words must be present, order-insensitive). Implicitly requires the call to have a transcript. Ignored when `has_transcript` is false. If omitted or empty, no filter is applied."
        example: "\"refund order delivery\""
      }
  ];

  // Directions (array).
  repeated string directions = 32 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of call directions (`inbound`, `outbound`). Not applied by the GetHistoryByGroups query; use the singular `direction` field for direction filtering."
        example: "[\"inbound\"]"
      }
  ];

  // Has transcript.
  google.protobuf.BoolValue has_transcript = 33 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Tri-state filter by transcript presence. true = only calls with a transcript (further narrowed by `fts` if set); false = only calls without a transcript; omitted/null = no filter (unless `fts` is set)."
        example: "true"
      }
  ];

  // Agent note.
  string agent_description = 34 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Case-insensitive pattern search (ILIKE) in the agent's wrap-up description of the queue attempt OR in any call annotation note. If omitted or empty, no filter is applied."
        example: "\"callback requested\""
      }
  ];

  // Leg owners.
  repeated int64 owner_id = 35 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of user IDs (OR logic). Matches calls where the given user is the direct owner of the leg (`user_id`) only; unlike `user_id`, participation in other legs is not considered. Empty array = no filter."
        example: "[101]"
      }
  ];

  // Grantees.
  repeated int64 grantee_id = 36 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of grantee IDs (OR logic): the authorization subject (user/role/gateway identity) that the call was placed on behalf of. Exact match on `grantee_id`. Empty array = no filter."
        example: "[55]"
      }
  ];

  // AI AMD results.
  repeated string amd_ai_result = 37 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of AI-based answering machine detection results (OR logic). Matched against `amd_ai_result` in lowercase. Empty array = no filter."
        example: "[\"human\", \"voicemail\"]"
      }
  ];

  // Talk time range.
  FilterBetween talk = 38 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on talk time (`talk_sec`) in SECONDS, i.e. the time the parties were actually connected, excluding ringing and hold. Omitted bound = open-ended."
        example: "{\"from\": 10, \"to\": 300}"
      }
  ];

  // Evaluated calls.
  google.protobuf.BoolValue rated = 39 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Tri-state filter by quality evaluation. false = only calls that have NOT been evaluated; true = only evaluated calls, optionally narrowed by `rated_user`, `rated_by`, `score_required` and `score_optional`. Setting any of those filters without `rated` also restricts results to evaluated calls. Omitted/null = no filter."
        example: "true"
      }
  ];

  // Evaluators.
  repeated int64 rated_by = 40 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of user IDs of evaluators (supervisors/QA) who created the evaluation (OR logic). Restricts to evaluated calls. Empty array = no filter."
        example: "[12]"
      }
  ];

  // Required score range.
  FilterBetween score_required = 41 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on the evaluation score of REQUIRED (mandatory) questions (`score_required`). Restricts to evaluated calls. Omitted bound = open-ended."
        example: "{\"from\": 70, \"to\": 100}"
      }
  ];

  // Optional score range.
  FilterBetween score_optional = 42 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Range filter (inclusive) on the evaluation score of OPTIONAL questions (`score_optional`). Restricts to evaluated calls. Omitted bound = open-ended."
        example: "{\"from\": 0, \"to\": 100}"
      }
  ];

  // Evaluated users.
  repeated int64 rated_user = 43 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of user IDs of the evaluated agents/operators (OR logic). Restricts to evaluated calls. Empty array = no filter."
        example: "[101]"
      }
  ];

  // Contacts.
  repeated int64 contact_id = 44 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of CRM contact IDs (OR logic). Exact match on the call's linked contact (`contact_id`). Empty array = no filter."
        example: "[88001]"
      }
  ];

  // Routing schemas.
  repeated int32 schema_id = 45 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of routing schema (call flow / IVR) IDs (OR logic). Matches calls that executed at least one of the given schemas (array overlap on `schema_ids`). Empty array = no filter."
        example: "[4, 9]"
      }
  ];

  // Transfers.
  google.protobuf.BoolValue has_transfer = 46 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Tri-state filter by transfers. true = only calls involved in a blind or attended transfer; false = only calls with no transfer; omitted/null = no filter."
        example: "true"
      }
  ];

  // Timeline mode.
  google.protobuf.BoolValue timeline = 47 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "If true, returns only the legs relevant for building a call timeline of the call tree given by `dependency_id`: transferred legs handled by a user, blind transfer legs, and legs whose parent differs from the root. REQUIRES `dependency_id`; without it the result is empty. Omitted/null = no filter."
        example: "true"
      }
  ];

  // Excluded queue types.
  repeated engine.QueueType excluded_queue_types = 48 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description: "Array of queue types to EXCLUDE from the result. Calls whose queue type is in the list are hidden; calls that did not pass through a queue are always kept. Empty array = nothing excluded."
      }
  ];
}

message AggregateRequest {
