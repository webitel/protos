  // Wrap-up form field values filled in by the agent (arbitrary JSON).
  google.protobuf.Value form_fields = 62 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "{\"reason\": \"refund\", \"resolved\": true}"}
  ];

  // ID of the leg this call is bridged with.
  string bridged_id = 63 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid" example: "\"c5d6e7f8-2b3c-4d4e-9f0a-1b2c3d4e5f60\""}
  ];

  // CRM contact linked to the call.
  Lookup contact = 64;

  // ID of the queue member associated with the call.
  int64 member_id = 65 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "900123"}
  ];

  // Routing schemas (call flows/IVR) executed during the call.
  repeated Lookup schemas = 67;

  // Phrase that triggered the hangup, if any.
  string hangup_phrase = 68;

  // All blind transfers performed during the call, in chronological order.
  repeated BlindTransfer blind_transfers = 69;

  // Caller number (A-number).
  string from_number = 70 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"380501234567\""}
  ];

  // Callee number (B-number).
  string to_number = 71 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"0800123456\""}
  ];

  // Human-readable name of the destination (e.g. DID or queue label).
  string destination_name = 72 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Support hotline\""}
  ];

  // Wrap-up form submitted by an agent for a queue attempt.
  message CallForm {

      // Agent who submitted the form.
    Lookup agent = 1;

    // Form field values (arbitrary JSON).
    google.protobuf.Value form_fields = 2 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "{\"reason\": \"refund\"}"}
    ];

    // Time the form was submitted (Unix epoch ms, UTC).
    int64 reporting_at = 3 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1790677050000"}
    ];
  }

  // Forms submitted across all queue attempts of the call (up to 20 entries).
  repeated CallForm forms = 73;

  // ID of the chat conversation linked to the call (video meeting/chat).
  string conversation_id = 74 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"d1e2f3a4-5b6c-7d8e-9f0a-1b2c3d4e5f60\""}
  ];

  // ID of the WebRTC meeting associated with the call.
  string meeting_id = 75 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"meet-8f31c2\""}
  ];

  // Media quality (MOS, jitter, packet loss, RTT) statistics of the call.
  QualityMetrics quality_metrics = 76;

  // User-Agent of the client/softphone that made or received the call.
  string user_agent = 77 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Webitel-Phone/1.4 (Chrome 129)\""}
  ];
}

