}

// Paginated list of call history records.
message ListHistoryCall {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
      json_schema: {
        title: "ListHistoryCall"
        description: "Page of call history records."
      }
    };

    // True if more records are available on the next page.
  bool next = 1 [
