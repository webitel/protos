syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "proto/webitel/option.proto";
import "lookup.proto";
import "filter.proto";
import "agent_absence.proto";
import "violation.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

service AgentWorkingScheduleService {
  option (option.objclass) = "working_schedules";

  // Модалка Add shifts, див. запит. Дні з відсутністю і дні під замочком іншого активного
  // графіка пропускаються і приходять у "skipped"; решта записується.
  //
  // Відмова всього запиту: storage.shift.refused зі списком порушень — зміна перетинається з
  // іншою зміною оператора, або оператор чи дата не з цього графіка;
  // storage.working_schedule.archived — архівний графік; service.request.too_large — більше за
  // ліміт (розрахований на команду з 200 операторів на місяць).
  rpc CreateAgentsWorkingScheduleShifts(CreateAgentsWorkingScheduleShiftsRequest) returns (CreateAgentsWorkingScheduleShiftsResponse) {
    option (option.access) = ACTION_CREATE;
    option (google.api.http) = {
      post: "/wfm/agents/working_schedules/{working_schedule_id}"
      body: "*"
    };
  }

  // Календар графіка: сторінка його операторів з комірками, свята й робочий тиждень календаря
  // графіка.
  rpc SearchAgentsWorkingSchedule(SearchAgentsWorkingScheduleRequest) returns (SearchAgentsWorkingScheduleResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/working_schedules/{working_schedule_id}"};
  }

  // Модалка Edit shift: одна зміна з часом, паузами й навичками. Зміну шлете цілком: паузи й
  // навички із запиту замінюють наявні. Видалити паузу з представлення День — той самий виклик,
  // але без цієї паузи. Потрібен etag з читання; у відповіді зміна з новим etag. Дозволено в
  // графіку draft, pending і active.
  //
  // Відмови: storage.shift.version_conflict (409) — зміну змінили після читання;
  // storage.shift.refused зі списком порушень — ті самі правила, що в Add shifts, плюс
  // відсутність чи замочок на дату; storage.working_schedule.archived; dbsql.query.no_rows
  // (404) — зміни вже немає.
  rpc UpdateAgentWorkingScheduleShift(UpdateAgentWorkingScheduleShiftRequest) returns (UpdateAgentWorkingScheduleShiftResponse) {
    option (option.access) = ACTION_UPDATE;
    option (google.api.http) = {
      put: "/wfm/agents/working_schedules/{working_schedule_id}/shifts/{shift.id}"
      body: "*"
    };
  }

  // Видаляє зміну разом з паузами й навичками. Відмови ті самі, що в
  // UpdateAgentWorkingScheduleShift, крім правил зміни.
  rpc DeleteAgentWorkingScheduleShift(DeleteAgentWorkingScheduleShiftRequest) returns (DeleteAgentWorkingScheduleShiftResponse) {
    option (option.access) = ACTION_UPDATE;
    option (google.api.http) = {delete: "/wfm/agents/working_schedules/{working_schedule_id}/shifts/{id}"};
  }
}

// Модалка Add shifts: тижневий шаблон, який сервер розгортає в зміни на діапазон дат. Години —
// хвилини від півночі за годинником у зоні календаря графіка, тож зміна зберігає свої години
// і під час переходу на літній час.
message CreateAgentsWorkingScheduleShiftsRequest {
  int64 working_schedule_id = 1;

  // Date from і Date to з модалки.
  DateRange date = 2 [(buf.validate.field).required = true];

  repeated LookupEntity agents = 3 [(buf.validate.field).repeated.min_items = 1];

  // Ключ — день тижня: 0 — неділя, …, 6 — субота. День, якого немає в мапі (вимкнений у
  // модалці), змін не отримує.
  map<int64, ShiftTemplateDay> days = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).map = {
      min_pairs: 1
      max_pairs: 7
      values: {
        required: true
      }
      keys: {
        int64: {
          gte: 0
          lte: 6
        }
      }
    }
  ];

  // Паузи кожного дня. Пауза належить діапазону, який її містить; пауза поза всіма
  // діапазонами дня — відмова запиту.
  repeated ShiftTemplatePause pauses = 7;

  // Навички, що вмикаються на час кожної зміни запиту. Різні навички на різні діапазони —
  // окремими запитами.
  repeated AgentScheduleShiftSkill skills = 8;

  reserved 4, 5;
}

// ShiftTemplateDay — зміни одного дня тижня; кілька, якщо оператор у різні години працює на
// різних навичках.
message ShiftTemplateDay {
  repeated ShiftTemplateRange ranges = 1 [(buf.validate.field).repeated.min_items = 1];
}

// ShiftTemplateRange — одна зміна дня, у хвилинах від півночі. Кінець раніше за початок —
// перехід через північ: 1320–360 — це 22:00–06:00, зміна дня, в який вона починається.
message ShiftTemplateRange {
  option (buf.validate.message).cel = {
    id: "time",
    message: "a shift cannot start and end at the same time",
    expression: "this.start != this.end"
  };

  int32 start = 1 [(buf.validate.field).int32 = {
    gte: 0
    lt: 1440
  }];

  int32 end = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1440
  }];
}

// ShiftTemplatePause — пауза кожного дня в певний час за годинником. У діапазоні через
// північ пауза після 00:00 належить зміні попереднього дня.
message ShiftTemplatePause {
  // Хвилини від півночі.
  int32 start = 1 [(buf.validate.field).int32 = {
    gte: 0
    lt: 1440
  }];

  // Хвилини.
  int32 duration = 2 [(buf.validate.field).int32.gt = 0];

  optional LookupEntity cause = 3;
}

message CreateAgentsWorkingScheduleShiftsResponse {
  repeated AgentWorkingSchedule items = 1;

  // Дні, які запит залишив без змін, і чому: storage.shift.absence або
  // storage.shift.locked_date з графіком, що займає дату.
  repeated Violation skipped = 2;
}

message UpdateAgentWorkingScheduleShiftRequest {
  int64 working_schedule_id = 1 [(buf.validate.field).int64.gt = 0];

  // Зміна з id і etag з читання. Записуються start_at, end_at, pauses і skills; решту
  // ставить сервер.
  AgentScheduleShift shift = 2 [(buf.validate.field).required = true];
}

message UpdateAgentWorkingScheduleShiftResponse {
  AgentScheduleShift shift = 1;
}

message DeleteAgentWorkingScheduleShiftRequest {
  int64 working_schedule_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];

  // etag з читання.
  string etag = 3 [(buf.validate.field).string.min_len = 1];
}

message DeleteAgentWorkingScheduleShiftResponse {
  int64 id = 1;
}

message SearchAgentsWorkingScheduleRequest {
  int64 working_schedule_id = 1;
  DateRange date = 2 [(buf.validate.field).required = true];

  repeated int64 supervisor_id = 3;
  repeated int64 team_id = 4;
  repeated int64 skill_id = 5;

  optional string q = 6;

  // Сторінка операторів, сортування за іменем, далі за id; спершу застосовуються фільтри.
  optional int32 page = 8 [(buf.validate.field).int32.gt = 0];
  optional int32 size = 9 [(buf.validate.field).int32.gt = 0];

  reserved 7;
}

message SearchAgentsWorkingScheduleResponse {
  repeated Holiday holidays = 1;
  repeated AgentWorkingSchedule items = 2;

  // Скільки операторів підходить під фільтри, на всіх сторінках; 0 на сторінці після останньої.
  int64 total = 3;
  bool next = 5;

  // Календар графіка: щоб відрізнити робочі дні від вихідних і показувати час у його зоні.
  ScheduleCalendar calendar = 4;
}

message ScheduleCalendar {
  // Назва зони IANA, наприклад "Europe/Kyiv".
  string time_zone = 1;

  // Ключ — день тижня, як у шаблоні Add shifts: 0 — неділя, …, 6 — субота. Є всі дні; день
  // без ranges — вихідний.
  map<int64, CalendarDay> week = 2;
}

message CalendarDay {
  // Робочі години, хвилини від півночі в зоні календаря.
  repeated CalendarRange ranges = 1;
}

message CalendarRange {
  int32 start = 1;
  int32 end = 2;
}

message Holiday {
  // Дата, як у DateRange: 00:00 UTC дня, мілісекунди epoch.
  int64 date = 1;
  string name = 2;

  reserved 3;
}

message AgentScheduleShiftPause {
  option (buf.validate.message).cel = {
    id: "time",
    message: "end time cannot be earlier than start time",
    expression: "this.start_at < this.end_at"
  };

  int64 id = 1;
  int64 domain_id = 2;
  int64 created_at = 3;
  LookupEntity created_by = 4;
  int64 updated_at = 5;
  LookupEntity updated_by = 6;

  // Мілісекунди epoch, у межах зміни.
  int64 start_at = 10 [(buf.validate.field).int64.gt = 0];
  int64 end_at = 11 [(buf.validate.field).int64.gt = 0];

  optional LookupEntity cause = 9;

  reserved 7, 8;
}

// AgentScheduleShiftSkill вмикає чи вимикає на час зміни навичку, яка в оператора вже є, з
// його власним capacity.
message AgentScheduleShiftSkill {
  LookupEntity skill = 1 [(buf.validate.field).required = true];
  bool enabled = 3;

  reserved 2;
}

message AgentScheduleShift {
  option (buf.validate.message).cel = {
    id: "time",
    message: "a shift ends after it starts and lasts at most 24 hours",
    expression: "this.start_at < this.end_at && this.end_at - this.start_at <= 86400000"
  };

  int64 id = 1;
  int64 domain_id = 2;
  int64 created_at = 3;
  LookupEntity created_by = 4;
  int64 updated_at = 5;
  LookupEntity updated_by = 6;

  // Мілісекунди epoch. Зміна закінчується перед end_at, тож наступна може починатися в end_at.
  int64 start_at = 11 [(buf.validate.field).int64.gt = 0];
  int64 end_at = 12 [(buf.validate.field).int64.gt = 0];

  repeated AgentScheduleShiftPause pauses = 9;
  repeated AgentScheduleShiftSkill skills = 10;

  // Ставить сервер. Робоча дата, як у DateRange: день, у який зміна почалась за зоною
  // календаря графіка, тож нічна зміна належить дню початку. 00:00 UTC цього дня, мілісекунди
  // epoch.
  int64 working_date = 17;

  // Версія зміни, приходить у кожному читанні. Потрібна для правки й видалення зміни.
  string etag = 14;

  // Ставить сервер.
  ShiftSource source = 15;

  // Ставить сервер для зміни планувальника: запуск планування, що її записав.
  int64 planner_run_id = 16;

  reserved 7, 8, 13;
}

enum ShiftSource {
  SHIFT_SOURCE_UNSPECIFIED = 0;
  SHIFT_SOURCE_MANUAL = 1;
  SHIFT_SOURCE_PLANNER = 2;
}

message AgentSchedule {
  // Робоча дата, як у DateRange: 00:00 UTC дня, мілісекунди epoch.
  int64 date = 1;

  // У оператора на цю дату зміни в іншому активному графіку: ставити зміну тут не можна.
  bool locked = 2;

  // У дні або відсутність, або зміни, не разом.
  AbsenceType absence = 3;

  // Id відсутності, щоб видалити її з календаря.
  int64 absence_id = 7;

  repeated AgentScheduleShift shifts = 6;

  reserved 4, 5;
}

message AgentWorkingSchedule {
  LookupEntity agent = 1;
  repeated AgentSchedule schedule = 2;
}