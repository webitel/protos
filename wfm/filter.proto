syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

message FilterBetween {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should be greater than from",
    expression: "this.to >= this.from"
  };

  int64 from = 1;
  int64 to = 2;
}

// DateRange is an inclusive range of calendar dates. A date anywhere in WFM is a day, not
// an instant: 00:00 UTC of that day in epoch milliseconds, the same for every client
// whatever its time zone. Any other value is refused, so a local midnight shows up as
// an error instead of a day shifted by the client's offset.
message DateRange {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should not be earlier than from",
    expression: "this.to >= this.from"
  };

  int64 from = 1 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];

  // The last day, included.
  int64 to = 2 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];
}