syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

message FilterBetween {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should be greater than from",
    expression: "this.to >= this.from"
  };

  int64 from = 1;
  int64 to = 2;
}

// DateRange — діапазон календарних дат, обидва кінці включно. Дата скрізь у WFM — це день, а не
// момент часу: 00:00 UTC цього дня в мілісекундах epoch (Date.UTC(рік, місяць, день)), однакова
// для кожного клієнта в будь-якій зоні. Інше значення відхиляється, тож локальна північ дає
// помилку валідації, а не день, зсунутий на зміщення клієнта.
message DateRange {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should not be earlier than from",
    expression: "this.to >= this.from"
  };

  int64 from = 1 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];

  // Останній день, включно.
  int64 to = 2 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];
}