syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

message FilterBetween {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should be greater than from",
    expression: "this.to >= this.from"
  };

  int64 from = 1;
  int64 to = 2;
}

// DateRange is an inclusive range of calendar dates, "YYYY-MM-DD". A calendar date
// is a day, not an instant: it does not depend on the client's time zone.
message DateRange {
  option (buf.validate.message).cel = {
    id: "between",
    message: "to should not be earlier than from",
    expression: "this.to >= this.from"
  };

  string from = 1 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  string to = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
}