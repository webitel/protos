syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "proto/webitel/option.proto";
import "lookup.proto";
import "filter.proto";
import "violation.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

service AgentAbsenceService {
  option (option.objclass) = "agent_absences";

  // Sets an absence for one day. An agent has one absence a day and a new one replaces the old
  // one of any type, so adding and changing the type is the same call. Past days are allowed.
  //
  // The agent's shifts on that day in a draft, pending or active schedule are deleted only on
  // confirmation. Without delete_shifts the call writes nothing and refuses with
  // storage.absence.shifts_to_delete, listing those shifts as storage.absence.shift violations.
  // With delete_shifts the shifts, their pauses and skills are deleted in the same transaction
  // and returned in deleted_shifts. Shifts of an archived schedule stay, next to the absence.
  //
  // Refusals: service.agent.access (403) - no access to the agent.
  rpc CreateAgentAbsence(CreateAgentAbsenceRequest) returns (CreateAgentAbsenceResponse) {
    option (option.access) = ACTION_CREATE;
    option (google.api.http) = {
      post: "/wfm/agents/{agent_id}/absences"
      body: "*"
    };
  }

  // Reads one absence per agent by its id.
  rpc ReadAgentAbsence(ReadAgentAbsenceRequest) returns (ReadAgentAbsenceResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/{agent_id}/absences/{id}"};
  }

  // Searches agent absences by filters.
  rpc SearchAgentAbsence(SearchAgentAbsenceRequest) returns (SearchAgentAbsenceResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/{agent_id}/absences"};
  }

  // Updates an absence by its id, with the result of CreateAgentAbsence. On a day with shifts it
  // refuses with storage.absence.shifts_to_delete and has no confirmation.
  rpc UpdateAgentAbsence(UpdateAgentAbsenceRequest) returns (UpdateAgentAbsenceResponse) {
    option (option.access) = ACTION_UPDATE;
    option (google.api.http) = {
      put: "/wfm/agents/{agent_id}/absences/{item.id}"
      body: "*"
    };
  }

  // Deletes an absence by its id; dbsql.query.no_rows (404) if there is none.
  rpc DeleteAgentAbsence(DeleteAgentAbsenceRequest) returns (DeleteAgentAbsenceResponse) {
    option (option.access) = ACTION_DELETE;
    option (google.api.http) = {delete: "/wfm/agents/{agent_id}/absences/{id}"};
  }

  // Sets absences of several types over ranges of dates for several agents; each day replaces
  // the absence it had. Shifts on those days are deleted as in CreateAgentAbsence: without
  // delete_shifts nothing is written and the refusal lists the shifts of every agent, with it
  // everything is written.
  //
  // Refusals: service.request.too_large - more than the limit, sized for a team of 200 agents
  // over a month; service.agent.access (403) - no access to an agent.
  rpc CreateAgentsAbsences(CreateAgentsAbsencesRequest) returns (CreateAgentsAbsencesResponse) {
    option (option.access) = ACTION_CREATE;
    option (google.api.http) = {
      post: "/wfm/agents/absences"
      body: "*"
    };
  }

  // Every agent the user has access to, with or without absences, and their absences over a
  // period. Ordered by name, then by id.
  rpc SearchAgentsAbsences(SearchAgentsAbsencesRequest) returns (SearchAgentsAbsencesResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/absences"};
  }
}

message CreateAgentAbsenceRequest {
  int64 agent_id = 1;
  Absence item = 2 [(buf.validate.field).required = true];

  // Deletes the agent's shifts on that day, the ones storage.absence.shifts_to_delete listed.
  bool delete_shifts = 3;
}

message CreateAgentAbsenceResponse {
  Absence item = 1;

  // The shifts deleted. They can differ from the ones the refusal listed if the schedule
  // changed in between.
  repeated DeletedShift deleted_shifts = 2;
}

// DeletedShift is a shift an absence deleted.
message DeletedShift {
  int64 id = 1;
  LookupEntity agent = 2;
  LookupEntity schedule = 3;

  // The working date, a date as in DateRange: 00:00 UTC of the day, epoch milliseconds.
  int64 date = 4;

  // Epoch milliseconds.
  int64 start_at = 5;
  int64 end_at = 6;
}

message ReadAgentAbsenceRequest {
  int64 id = 1;
  int64 agent_id = 2;
}

message ReadAgentAbsenceResponse {
  Absence item = 1;
}

message SearchAgentAbsenceRequest {
  int64 agent_id = 1;
  optional int32 page = 2;
  optional int32 size = 3;
  optional string sort = 4;
  repeated string fields = 5;
  repeated string filters = 6;
}

message SearchAgentAbsenceResponse {
  repeated Absence items = 1;
}

message UpdateAgentAbsenceRequest {
  int64 agent_id = 1;
  Absence item = 2;
}

message UpdateAgentAbsenceResponse {
  Absence item = 1;
}

message DeleteAgentAbsenceRequest {
  int64 id = 1;
  int64 agent_id = 2;
}

message DeleteAgentAbsenceResponse {
  int64 id = 1;
}

message CreateAgentsAbsencesRequest {
  message absentType {
    AbsenceType type_id = 1 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];

    // Dates as in DateRange: 00:00 UTC of the day, epoch milliseconds; date_to is included.
    int64 date_from = 2 [
      (buf.validate.field).int64.gt = 0,
      (buf.validate.field).cel = {
        id: "date"
        message: "a date is 00:00 UTC of the day, in epoch milliseconds"
        expression: "this % 86400000 == 0"
      }
    ];

    int64 date_to = 3 [
      (buf.validate.field).int64.gt = 0,
      (buf.validate.field).cel = {
        id: "date"
        message: "a date is 00:00 UTC of the day, in epoch milliseconds"
        expression: "this % 86400000 == 0"
      }
    ];

    option (buf.validate.message).cel = {
      id: "absent_at.filter",
      message: "date_to should not be earlier than date_from",
      expression: "this.date_to >= this.date_from"
    };

    reserved 4, 5;
  }

  repeated absentType items = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated int64 agent_ids = 2 [(buf.validate.field).repeated.min_items = 1];

  // As in CreateAgentAbsenceRequest.
  bool delete_shifts = 3;
}

message CreateAgentsAbsencesResponse {
  repeated AgentAbsences items = 1;

  // As in CreateAgentAbsenceResponse.
  repeated DeletedShift deleted_shifts = 2;
}

message SearchAgentsAbsencesRequest {
  // The period of the absences returned. It limits the absences, not the agents.
  DateRange date = 7 [(buf.validate.field).required = true];

  repeated int64 team_id = 8;
  repeated int64 supervisor_id = 9;
  repeated int64 skill_id = 10;

  // Searches by agent name.
  optional string q = 1 [(buf.validate.field).string.max_len = 250];

  optional int32 page = 2 [(buf.validate.field).int32.gt = 0];
  optional int32 size = 3 [(buf.validate.field).int32.gt = 0];

  // +name when absent.
  optional string sort = 4 [(buf.validate.field).string = {
    in: ["+name", "-name"]
  }];

  repeated string fields = 5;
}

message SearchAgentsAbsencesResponse {
  // An agent without absences in the period comes without absences.
  repeated AgentAbsences items = 1;
  bool next = 2;

  // Agents that match the filters, on all pages.
  int64 total = 3;
}

message AgentAbsences {
  LookupEntity agent = 1;
  repeated Absence absences = 2;
}

enum AbsenceType {
  ABSENCE_TYPE_UNSPECIFIED = 0;
  ABSENCE_TYPE_DAYOFF = 1;
  ABSENCE_TYPE_VACATION = 2;
  ABSENCE_TYPE_SICKDAY = 3;
}

message Absence {
  int64 id = 1;
  int64 domain_id = 2;
  int64 created_at = 3;
  LookupEntity created_by = 4;
  int64 updated_at = 5;
  LookupEntity updated_by = 6;

  AbsenceType type_id = 7 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];

  // A date as in DateRange: 00:00 UTC of the day, epoch milliseconds.
  int64 absent_at = 8 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];

  reserved 9;
}
