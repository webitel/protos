syntax = "proto3";

package wfm;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "proto/webitel/option.proto";
import "lookup.proto";
import "filter.proto";
import "violation.proto";

option go_package = "github.com/webitel/protos/wfm;wfm";

service AgentAbsenceService {
  option (option.objclass) = "agent_absences";

  // Ставить оператору відсутність на день. Відсутність одна на день, нова заміняє стару
  // будь-якого типу, тож додати й змінити тип — той самий виклик. Минулі дні дозволені.
  //
  // Відмови: storage.absence.refused з порушенням, де названо графік, — якщо на цей день в
  // оператора є зміна в графіку draft, pending чи active; service.agent.access (403) — немає
  // доступу до оператора.
  rpc CreateAgentAbsence(CreateAgentAbsenceRequest) returns (CreateAgentAbsenceResponse) {
    option (option.access) = ACTION_CREATE;
    option (google.api.http) = {
      post: "/wfm/agents/{agent_id}/absences"
      body: "*"
    };
  }

  // Читає одну відсутність оператора за id.
  rpc ReadAgentAbsence(ReadAgentAbsenceRequest) returns (ReadAgentAbsenceResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/{agent_id}/absences/{id}"};
  }

  // Відсутності одного оператора.
  rpc SearchAgentAbsence(SearchAgentAbsenceRequest) returns (SearchAgentAbsenceResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/{agent_id}/absences"};
  }

  // Оновлює відсутність за id. Фронту не потрібен: той самий результат дає CreateAgentAbsence.
  rpc UpdateAgentAbsence(UpdateAgentAbsenceRequest) returns (UpdateAgentAbsenceResponse) {
    option (option.access) = ACTION_UPDATE;
    option (google.api.http) = {
      put: "/wfm/agents/{agent_id}/absences/{item.id}"
      body: "*"
    };
  }

  // Видаляє відсутність за id; dbsql.query.no_rows (404), якщо її немає.
  rpc DeleteAgentAbsence(DeleteAgentAbsenceRequest) returns (DeleteAgentAbsenceResponse) {
    option (option.access) = ACTION_DELETE;
    option (google.api.http) = {delete: "/wfm/agents/{agent_id}/absences/{id}"};
  }

  // Модалка Add absence: відсутності кількох типів на діапазони дат кільком операторам. Дні,
  // де в оператора є зміна в графіку draft, pending чи active, пропускаються і приходять у
  // "skipped"; решта записується, кожен день заміняє те, що там було.
  //
  // Відмови: service.request.too_large — більше за ліміт (розрахований на команду з 200
  // операторів на місяць); service.agent.access (403) — немає доступу до оператора.
  rpc CreateAgentsAbsences(CreateAgentsAbsencesRequest) returns (CreateAgentsAbsencesResponse) {
    option (option.access) = ACTION_CREATE;
    option (google.api.http) = {
      post: "/wfm/agents/absences"
      body: "*"
    };
  }

  // Сторінка Agents: усі оператори, до яких у користувача є доступ, з відсутностями чи без,
  // і їхні відсутності за видимий тиждень чи місяць. Сортування за іменем, далі за id.
  rpc SearchAgentsAbsences(SearchAgentsAbsencesRequest) returns (SearchAgentsAbsencesResponse) {
    option (option.access) = ACTION_READ;
    option (google.api.http) = {get: "/wfm/agents/absences"};
  }
}

message CreateAgentAbsenceRequest {
  int64 agent_id = 1;
  Absence item = 2 [(buf.validate.field).required = true];
}

message CreateAgentAbsenceResponse {
  Absence item = 1;
}

message ReadAgentAbsenceRequest {
  int64 id = 1;
  int64 agent_id = 2;
}

message ReadAgentAbsenceResponse {
  Absence item = 1;
}

message SearchAgentAbsenceRequest {
  int64 agent_id = 1;
  optional int32 page = 2;
  optional int32 size = 3;
  optional string sort = 4;
  repeated string fields = 5;
  repeated string filters = 6;
}

message SearchAgentAbsenceResponse {
  repeated Absence items = 1;
}

message UpdateAgentAbsenceRequest {
  int64 agent_id = 1;
  Absence item = 2;
}

message UpdateAgentAbsenceResponse {
  Absence item = 1;
}

message DeleteAgentAbsenceRequest {
  int64 id = 1;
  int64 agent_id = 2;
}

message DeleteAgentAbsenceResponse {
  int64 id = 1;
}

message CreateAgentsAbsencesRequest {
  message absentType {
    AbsenceType type_id = 1 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];

    // Дати, як у DateRange: 00:00 UTC дня, мілісекунди epoch; date_to включно.
    int64 date_from = 2 [
      (buf.validate.field).int64.gt = 0,
      (buf.validate.field).cel = {
        id: "date"
        message: "a date is 00:00 UTC of the day, in epoch milliseconds"
        expression: "this % 86400000 == 0"
      }
    ];

    int64 date_to = 3 [
      (buf.validate.field).int64.gt = 0,
      (buf.validate.field).cel = {
        id: "date"
        message: "a date is 00:00 UTC of the day, in epoch milliseconds"
        expression: "this % 86400000 == 0"
      }
    ];

    option (buf.validate.message).cel = {
      id: "absent_at.filter",
      message: "date_to should not be earlier than date_from",
      expression: "this.date_to >= this.date_from"
    };

    reserved 4, 5;
  }

  repeated absentType items = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated int64 agent_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

message CreateAgentsAbsencesResponse {
  repeated AgentAbsences items = 1;

  // Пропущені дні: причина storage.absence.shift і графік, де стоїть зміна.
  repeated Violation skipped = 2;
}

message SearchAgentsAbsencesRequest {
  // Видимий період, тиждень чи місяць. Обмежує відсутності, а не операторів.
  DateRange date = 7 [(buf.validate.field).required = true];

  repeated int64 team_id = 8;
  repeated int64 supervisor_id = 9;
  repeated int64 skill_id = 10;

  // Пошук за іменем оператора.
  optional string q = 1 [(buf.validate.field).string.max_len = 250];

  optional int32 page = 2 [(buf.validate.field).int32.gt = 0];
  optional int32 size = 3 [(buf.validate.field).int32.gt = 0];

  // +name чи -name; без нього +name.
  optional string sort = 4;
  repeated string fields = 5;

  reserved 6;
}

message SearchAgentsAbsencesResponse {
  // Оператор без відсутностей за період приходить без "absences".
  repeated AgentAbsences items = 1;
  bool next = 2;

  // Скільки операторів підходить під фільтри, на всіх сторінках.
  int64 total = 3;
}

message AgentAbsences {
  LookupEntity agent = 1;
  repeated Absence absences = 2;
}

enum AbsenceType {
  ABSENCE_TYPE_UNSPECIFIED = 0;
  ABSENCE_TYPE_DAYOFF = 1;
  ABSENCE_TYPE_VACATION = 2;
  ABSENCE_TYPE_SICKDAY = 3;
}

message Absence {
  int64 id = 1;
  int64 domain_id = 2;
  int64 created_at = 3;
  LookupEntity created_by = 4;
  int64 updated_at = 5;
  LookupEntity updated_by = 6;

  AbsenceType type_id = 7 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3]}];

  // Дата, як у DateRange: 00:00 UTC дня, мілісекунди epoch.
  int64 absent_at = 8 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).cel = {
      id: "date"
      message: "a date is 00:00 UTC of the day, in epoch milliseconds"
      expression: "this % 86400000 == 0"
    }
  ];

  reserved 9;
}
