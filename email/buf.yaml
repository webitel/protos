version: v1
name: buf.build/webitel/email
deps:
  - buf.build/googleapis/googleapis
  - buf.build/webitel/general
  - buf.build/webitel/protoc-gen-go-webitel
breaking:
  use:
    - FILE
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
  ignore:
    - google/api/annotations.proto
