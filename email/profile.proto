syntax = "proto3";

package webitel.email;

option go_package = "github.com/webitel/webitel-emails/api/email;email";

import "general.proto";
import "google/api/annotations.proto";
import "proto/webitel/option.proto";

// EmailProfiles manages mailbox connection settings and authorization.
service EmailProfiles {
  option (option.objclass) = "email_profile";

  rpc ListEmailProfiles(ListEmailProfilesRequest) returns (EmailProfileList) {
    option (google.api.http) = {
      get: "/v1/email/profiles"
    };
    option (option.access) = ACTION_READ;
  }

  rpc LocateEmailProfile(LocateEmailProfileRequest) returns (EmailProfile) {
    option (google.api.http) = {
      get: "/v1/email/profiles/{id}"
    };
    option (option.access) = ACTION_READ;
  }

  rpc CreateEmailProfile(CreateEmailProfileRequest) returns (EmailProfile) {
    option (google.api.http) = {
      post: "/v1/email/profiles"
      body: "input"
    };
    option (option.access) = ACTION_CREATE;
  }

  rpc UpdateEmailProfile(UpdateEmailProfileRequest) returns (EmailProfile) {
    option (google.api.http) = {
      put: "/v1/email/profiles/{id}"
      body: "input"
      additional_bindings {
        patch: "/v1/email/profiles/{id}"
        body: "input"
      }
    };
    option (option.access) = ACTION_UPDATE;
  }

  rpc DeleteEmailProfile(DeleteEmailProfileRequest) returns (EmailProfile) {
    option (google.api.http) = {
      delete: "/v1/email/profiles/{id}"
    };
    option (option.access) = ACTION_DELETE;
  }

  rpc TestEmailProfile(TestEmailProfileRequest) returns (TestEmailProfileResponse) {
    option (google.api.http) = {
      post: "/v1/email/profiles/{id}/test"
    };
    option (option.access) = ACTION_UPDATE;
  }

  rpc BeginEmailProfileOAuth(BeginEmailProfileOAuthRequest) returns (BeginEmailProfileOAuthResponse) {
    option (google.api.http) = {
      post: "/v1/email/profiles/{id}/oauth/start"
    };
    option (option.access) = ACTION_UPDATE;
  }

  rpc CompleteEmailProfileOAuth(CompleteEmailProfileOAuthRequest) returns (EmailProfile) {
    option (google.api.http) = {
      post: "/v1/email/profiles/{id}/oauth/callback"
      body: "*"
    };
    option (option.access) = ACTION_UPDATE;
  }

  rpc DisconnectEmailProfileOAuth(DisconnectEmailProfileOAuthRequest) returns (EmailProfile) {
    option (google.api.http) = {
      delete: "/v1/email/profiles/{id}/oauth"
    };
    option (option.access) = ACTION_UPDATE;
  }
}

enum EmailAuthType {
  EMAIL_AUTH_TYPE_UNSPECIFIED = 0;
  EMAIL_AUTH_TYPE_BASIC = 1;
  EMAIL_AUTH_TYPE_OAUTH2 = 2;
}

enum EmailOAuthProvider {
  EMAIL_OAUTH_PROVIDER_UNSPECIFIED = 0;
  EMAIL_OAUTH_PROVIDER_GOOGLE = 1;
  EMAIL_OAUTH_PROVIDER_MICROSOFT = 2;
}

enum EmailConnectionSecurity {
  EMAIL_CONNECTION_SECURITY_UNSPECIFIED = 0;
  EMAIL_CONNECTION_SECURITY_TLS = 1;
  EMAIL_CONNECTION_SECURITY_STARTTLS = 2;
}

enum EmailConnectionState {
  EMAIL_CONNECTION_STATE_UNSPECIFIED = 0;
  EMAIL_CONNECTION_STATE_IDLE = 1;
  EMAIL_CONNECTION_STATE_READY = 2;
  EMAIL_CONNECTION_STATE_ERROR = 3;
  EMAIL_CONNECTION_STATE_REAUTHORIZATION_REQUIRED = 4;
}

// EmailProfile is a mailbox configuration returned by the API.
// Credentials and OAuth tokens are intentionally omitted.
message EmailProfile {
  int64 id = 1;
  int64 domain_id = 2;

  string name = 3;
  string description = 4;
  bool enabled = 5;

  string email_address = 6;
  string sender_name = 7;
  string reply_to = 8;
  string signature = 9;

  string imap_host = 10;
  int32 imap_port = 11;
  EmailConnectionSecurity imap_security = 12;
  string smtp_host = 13;
  int32 smtp_port = 14;
  EmailConnectionSecurity smtp_security = 15;
  string username = 16;
  string mailbox = 17;
  int32 fetch_interval_seconds = 18;

  int64 flow_id = 19;
  EmailAuthType auth_type = 20;
  EmailOAuthProvider oauth_provider = 21;
  string oauth_client_id = 22;
  bool oauth_connected = 23;

  EmailConnectionState connection_state = 24;
  int64 last_successful_connection_at = 25;
  string connection_error = 26;

  int64 created_at = 30;
  general.Lookup created_by = 31;
  int64 updated_at = 32;
  general.Lookup updated_by = 33;
}

// InputEmailProfile contains fields accepted when a profile is created or
// updated. Password and OAuth client secret are write-only API fields.
message InputEmailProfile {
  string name = 1;
  string description = 2;
  bool enabled = 3;

  string email_address = 4;
  string sender_name = 5;
  string reply_to = 6;
  string signature = 7;

  string imap_host = 8;
  int32 imap_port = 9;
  EmailConnectionSecurity imap_security = 10;
  string smtp_host = 11;
  int32 smtp_port = 12;
  EmailConnectionSecurity smtp_security = 13;
  string username = 14;
  string password = 15;
  string mailbox = 16;
  int32 fetch_interval_seconds = 17;

  int64 flow_id = 18;
  EmailAuthType auth_type = 19;
  EmailOAuthProvider oauth_provider = 20;
  string oauth_client_id = 21;
  string oauth_client_secret = 22;
}

// ListEmailProfilesRequest defines pagination, search, sorting, and field
// selection for Email Profiles.
message ListEmailProfilesRequest {
  int32 page = 1;
  int32 size = 2;
  string q = 3;
  string sort = 4;
  repeated string fields = 5;
}

// EmailProfileList is a page of Email Profiles.
message EmailProfileList {
  repeated EmailProfile items = 1;
  bool next = 2;
}

// LocateEmailProfileRequest selects an Email Profile by id.
message LocateEmailProfileRequest {
  int64 id = 1;
}

// CreateEmailProfileRequest wraps the Email Profile fields to create.
message CreateEmailProfileRequest {
  InputEmailProfile input = 1;
}

// UpdateEmailProfileRequest wraps the Email Profile id and updated fields.
message UpdateEmailProfileRequest {
  int64 id = 1;
  InputEmailProfile input = 2;
}

// DeleteEmailProfileRequest selects an Email Profile by id.
message DeleteEmailProfileRequest {
  int64 id = 1;
}

// TestEmailProfileRequest selects a saved Email Profile to test.
message TestEmailProfileRequest {
  int64 id = 1;
}

// EmailConnectionTestResult describes a single protocol connection test.
message EmailConnectionTestResult {
  bool success = 1;
  string error = 2;
}

// TestEmailProfileResponse contains independent IMAP and SMTP test results.
message TestEmailProfileResponse {
  EmailConnectionTestResult imap = 1;
  EmailConnectionTestResult smtp = 2;
}

// BeginEmailProfileOAuthRequest selects an Email Profile for OAuth
// authorization.
message BeginEmailProfileOAuthRequest {
  int64 id = 1;
}

// BeginEmailProfileOAuthResponse provides the OAuth authorization entry point.
message BeginEmailProfileOAuthResponse {
  string auth_url = 1;
  string state = 2;
}

// CompleteEmailProfileOAuthRequest contains the authorization code returned by
// the OAuth provider and the state generated when authorization began.
message CompleteEmailProfileOAuthRequest {
  int64 id = 1;
  string code = 2;
  string state = 3;
}

// DisconnectEmailProfileOAuthRequest selects an Email Profile whose OAuth
// authorization should be removed.
message DisconnectEmailProfileOAuthRequest {
  int64 id = 1;
}
