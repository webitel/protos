syntax = "proto3";

option go_package = "github.com/webitel/protos/cc";

import "const.proto";

package cc;

service MemberService {
    rpc AttemptResult(AttemptResultRequest) returns (AttemptResultResponse) {}

    rpc AttemptRenewalResult(AttemptRenewalResultRequest) returns (AttemptRenewalResultResponse) {}

    rpc CallJoinToQueue(CallJoinToQueueRequest) returns (stream QueueEvent) {}
    rpc ChatJoinToQueue(ChatJoinToQueueRequest) returns (stream QueueEvent) {}
    rpc CallJoinToAgent(CallJoinToAgentRequest) returns (stream QueueEvent) {}
    rpc OutboundCall(OutboundCallRequest) returns (OutboundCallResponse) {}
    rpc TaskJoinToAgent(TaskJoinToAgentRequest) returns (stream QueueEvent) {}

    rpc IMJoinToQueue(IMJoinToQueueRequest) returns (IMJoinToQueueResponse) {}

    rpc CancelAttempt(CancelAttemptRequest) returns (CancelAttemptResponse) {}
    rpc CancelAgentDistribute(CancelAgentDistributeRequest) returns (CancelAgentDistributeResponse) {}

    rpc EmailJoinToQueue(EmailJoinToQueueRequest) returns (EmailJoinToQueueResponse) {}
    rpc DirectAgentToMember(DirectAgentToMemberRequest) returns (DirectAgentToMemberResponse) {}

    rpc ProcessingFormAction(ProcessingFormActionRequest) returns (ProcessingFormActionResponse) {}
    rpc ProcessingComponentAction(ProcessingComponentActionRequest) returns (ProcessingComponentActionResponse) {}
    rpc ProcessingFormSave(ProcessingFormSaveRequest) returns (ProcessingFormSaveResponse) {}

    rpc Transfer(TransferRequest) returns (TransferResponse) {}

    rpc InterceptAttempt(InterceptAttemptRequest) returns (InterceptAttemptResponse) {}
    rpc ResumeAttempt(ResumeAttemptRequest) returns (ResumeAttemptResponse) {}

    // Email attempt lifecycle; the request form tells the caller: an operator or a Flow.
    rpc EmailAttemptTake(EmailAttemptTakeRequest) returns (EmailAttemptResponse) {}
    rpc EmailAttemptPostpone(EmailAttemptPostponeRequest) returns (EmailAttemptResponse) {}
    rpc EmailAttemptReturn(EmailAttemptReturnRequest) returns (EmailAttemptResponse) {}
    rpc EmailAttemptComplete(EmailAttemptCompleteRequest) returns (EmailAttemptResponse) {}
    // Wakes the active attempt of the Thread once per inbound Email event, with or without a Flow.
    rpc EmailWakeUp(EmailWakeUpRequest) returns (EmailWakeUpResponse) {}
}

message IMJoinToQueueRequest {
    message Queue {
        int32 id = 1;
        string name = 2;
    }

    string thread_id = 1;
    Queue queue = 2;
    int32 timeout = 4;
    int32 priority = 5;
    map<string,string> variables= 6;
    int32 bucket_id = 7;
    int32 sticky_agent_id = 8;

    message Endpoint {
        string name = 1;
        string sub = 2;
        string member_id = 3;
    }
    message MemberInfo {
        string type = 1;
        string name = 2;
        string iss = 3;
        string sub = 4;
        int32 role = 5;
        string member_id = 6;
    }
    message ThreadInfo {
        Endpoint from = 1;
        Endpoint to = 2;

        string subject = 3;
        repeated MemberInfo members = 4;
        string last_message = 5;

    }
    ThreadInfo thread = 9;

    int64 domain_id = 100;
}

message IMJoinToQueueResponse {
    int64 attempt_id = 1;
    // Attached to the thread's already bridged attempt.
    bool bridged = 2;
}

message ResumeAttemptRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;

    // An Email attempt is resumed either by its agent (attempt_id, thread_id, agent_id,
    // expected_version, command_id) or by a Flow (thread_id and email_event_id only).
    int64 thread_id = 3;
    int32 agent_id = 4;
    optional int64 expected_version = 5;
    string command_id = 6;
    string email_event_id = 7;
}

message ResumeAttemptResponse {
    bool ok = 1;
    // Set for an Email attempt.
    EmailAttemptResponse email = 2;
}

message InterceptAttemptRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;
    int32 agent_id = 3;
}

message InterceptAttemptResponse {

}

message CancelAttemptRequest {
    int64 attempt_id = 1;
    string result = 2;
}

message CancelAttemptResponse {

}

message ProcessingFormActionRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;

    string app_id = 3;
    string form_id = 4;

    string action = 5;
    map<string,string> fields = 6;
}

message ProcessingFormActionResponse {

}

message ProcessingFormSaveRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;

    string app_id = 3;
    string form_id = 4;

    map<string,string> fields = 5;
    bytes form = 6;
}

message ProcessingFormSaveResponse {

}


message ProcessingComponentActionRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;

    string app_id = 3;
    string id = 4;
    string form_id = 5;
    string component_id = 6;

    string action = 7;
    map<string,string> variables = 8;
    bool sync = 9;
}

message ProcessingComponentActionResponse {

}

message TransferRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;

    int32 agent_id = 3;
    int32 queue_id = 4;

    map<string,string> form_fields = 5;
}

message TransferResponse {

}

message CancelAgentDistributeRequest {
    int32 agent_id = 1;
}

message CancelAgentDistributeResponse {

}

message MemberCommunicationType {
    int32 id = 1;
    string name = 2;
}

message MemberCommunication {
    string destination = 1;
    MemberCommunicationType type = 2;
    string description = 3;
}

message QueueFormSchema {
    int32 id = 1;
}

message ProcessingProlongation {
    bool enabled = 1;
    uint32 repeats_number = 2;
    uint32 prolongation_time_sec = 3;
    bool is_timeout_retry = 4;
}

message TaskJoinToAgentRequest {
    message Processing {
        bool enabled = 1;
        uint32 renewal_sec = 2;
        uint32 sec = 3;
        QueueFormSchema form = 4;
        ProcessingProlongation processing_prolongation = 5;
        bool autosave = 6;
    }

    int32 agent_id = 1;
    int32 timeout = 2;
    map<string,string> variables = 3;
    Processing processing = 4;
    string queue_name = 5;
    bool cancel_distribute = 6;
    MemberCommunication destination = 7;

    int64 domain_id = 100;
}

message OutboundCallRequest {
    message Processing {
        bool enabled = 1;
        uint32 renewal_sec = 2;
        uint32 sec = 3;
        QueueFormSchema form = 4;
        bool without_answer = 5;
        ProcessingProlongation processing_prolongation = 6;
        bool autosave = 7;
    }
    int64 user_id= 1;
    int64 domain_id= 2;
    string call_id = 3;
    int32 timeout = 4;
    map<string,string> variables = 5;
    Processing processing = 6;
    string queue_name = 7;
    bool cancel_distribute = 8;
}

message OutboundCallResponse {
    int64 attempt_id = 1;
    int32 agent_id = 2;
}

message CallJoinToAgentRequest {
    message WaitingMusic {
        int32 id = 1;
        string name = 2;
        string type = 3;
    }

    message Processing {
        bool enabled = 1;
        uint32 renewal_sec = 2;
        uint32 sec = 3;
        QueueFormSchema form = 4;
        ProcessingProlongation processing_prolongation = 5;
        bool autosave = 6;
    }

    string member_call_id = 1;
    int32 agent_id = 2;
    WaitingMusic waitingMusic = 3;
    int32 timeout = 4;
    map<string,string> variables = 5;
    Processing processing = 6;
    string queue_name = 7;
    bool cancel_distribute = 8;
    bool is_transfer = 9;

    int64 domain_id = 100;
}

message AttemptRenewalResultRequest {
    int64 domain_id = 1;
    int64 attempt_id = 2;
    uint32 renewal = 3;

    // Required for an Email attempt, which is renewed only by its agent at the expected version.
    int64 thread_id = 4;
    int32 agent_id = 5;
    optional int64 expected_version = 6;
    string command_id = 7;
}

message AttemptRenewalResultResponse {
    // Set for an Email attempt.
    EmailAttemptResponse email = 1;
}

message QueueEvent {
    string name = 1;

    message JoinedData {
        int64 attempt_id = 1;
        string app_id = 2;
    }

    message OfferingData {
        int32 agent_id = 1;
        string agent_call_id = 2;
        string agent_name = 3;
    }

    message MissedAgent {
        int64 timeout = 1;
    }

    message BridgedData {
        int32 agent_id = 1;
    }

    message LeavingData {
        string result = 1;
    }

    oneof data {
        OfferingData offering = 2;
        BridgedData bridged = 3;
        MissedAgent missed = 4;
        LeavingData leaving = 5;
        JoinedData joined = 6;
    }
}


message AnswerConversationRequest {
    string channel_id = 1;
}

message AnswerConversationResponse {

}

message ChatJoinToQueueRequest {
    message Queue {
        int32 id = 1;
        string name = 2;
    }

    string conversation_id = 1;
    Queue queue = 2;
    int32 timeout = 4;
    int32 priority = 5;
    map<string,string> variables= 6;
    int32 bucket_id = 7;
    int32 sticky_agent_id = 8;
    bool extra_chat_count = 9;

    int64 domain_id = 100;
}

message EmailJoinToQueueRequest {
    // Legacy cc_email id; ignored by Emails 2.0.
    string email_id = 1 [deprecated = true];
    int32 queue_id = 2;
    // email-service Thread joined to the queue.
    int64 thread_id = 3;
    // Idempotency key: the email.message.inbound event that started the Flow.
    // Valid replays return the stored result without changing routing parameters.
    string email_event_id = 4;
    // Priority in [0, 100]; default 0. Invalid values return InvalidArgument
    // with ID store.sql_member.email_join.invalid_priority.
    int32 priority = 5;
    // Explicit Sticky candidate; 0 means no candidate.
    int32 sticky_agent_id = 6;
    // Allows Extra capacity independently of priority; default false.
    bool extra_email_count = 7;
    // Initial inbound From address, trimmed and lowercased; empty if unavailable.
    string from_address = 8;

    int64 domain_id = 100;
}

message EmailJoinToQueueResponse {
    enum Result {
        RESULT_UNSPECIFIED = 0;
        // A new attempt was created for the Thread.
        RESULT_CREATED = 1;
        // The Thread already had an active attempt; it was returned unchanged.
        RESULT_ALREADY_ACTIVE = 2;
        // The event was already joined; the stored result is returned.
        RESULT_REPLAYED = 3;
    }

    string status = 1 [deprecated = true];
    int64 attempt_id = 2;
    // Queue of the attempt, which may differ from the requested one.
    int32 queue_id = 3;
    Result result = 4;
}

message DirectAgentToMemberRequest {
    int64 member_id = 1;
    int64 agent_id = 2;

    int32 communication_id = 3;
    int64 domain_id = 4;
}

message DirectAgentToMemberResponse {
    int64 attempt_id = 1;
}

message CallJoinToQueueRequest {
    message Queue {
        int32 id = 1;
        string name = 2;
    }
    message WaitingMusic {
        int32 id = 1;
        string name = 2;
        string type = 3;
    }

    string member_call_id = 1;
    Queue queue = 2;
    WaitingMusic waitingMusic = 3;
    int32 timeout = 4;
    int32 priority = 5;
    map<string,string> variables= 6;
    int32 bucket_id = 7;
    int32 sticky_agent_id = 8;
    bool is_transfer = 9;

    int64 domain_id = 100;
}

message CallJoinToQueueResponse {
    string status = 1;
}

message MemberCommunicationCreateRequest {
    string destination = 1;
    engine.Lookup type = 2;
    int32 priority = 3;
    string description = 4;

    engine.Lookup resource = 5;
    string display = 6;
    int64 stop_at = 7;
    string dtmf = 8;
}

message AttemptResultRequest {
    int64 attempt_id = 1;
    string status = 2; // SUCCESS / CANCEL - абонент виключається з черги з цим статусом, якщо пусто то: якщо остання спроба то ABANDONED або буде очікувати наступний дзвінок

    int64 next_distribute_at = 3;
    int64 expire_at = 4;
    map<string, string> variables = 5;
    bool display = 6;
    string description = 7;
    int64 transfer_queue_id = 8;

    int32 agent_id = 9;
    bool exclude_current_communication = 10;
    bool redial = 11;
    repeated MemberCommunicationCreateRequest add_communications = 12;
    int32 wait_between_retries = 13;
    bool only_current_communication = 14;
    bool draft = 15;
}

message AttemptResultResponse {
    string status = 1;
}

// Operator form of an Email attempt command, sent by engine for the agent of the attempt.
message EmailAttemptOperator {
    int64 attempt_id = 1;
    int32 agent_id = 2;
    // attempt_version the agent saw; a newer attempt rejects the command.
    optional int64 expected_version = 3;
    // Idempotency key of the command; a retry repeats it with the same arguments.
    string command_id = 4;
}

// Flow form: the attempt is the active one of the Thread, woken by this inbound Email event.
message EmailAttemptFlow {
    string email_event_id = 1;
}

message EmailAttemptTakeRequest {
    int64 domain_id = 1;
    int64 thread_id = 2;
    EmailAttemptOperator operator = 3;
}

message EmailAttemptPostponeRequest {
    int64 domain_id = 1;
    int64 thread_id = 2;

    oneof caller {
        EmailAttemptOperator operator = 3;
        EmailAttemptFlow flow = 4;
    }

    oneof deadline {
        // Unix milliseconds.
        int64 postponed_until = 5;
        int32 postpone_for_sec = 6;
    }
}

message EmailAttemptReturnRequest {
    int64 domain_id = 1;
    int64 thread_id = 2;
    EmailAttemptOperator operator = 3;
}

message EmailAttemptCompleteRequest {
    int64 domain_id = 1;
    int64 thread_id = 2;
    EmailAttemptOperator operator = 3;
}

// State of the attempt after the command, or after its first execution for a replay.
message EmailAttemptResponse {
    int64 attempt_id = 1;
    int64 thread_id = 2;
    // waiting, offering, active, postponed, processing or leaving.
    string state = 3;
    int64 attempt_version = 4;
    // Order of the change among the changes of the Thread.
    int64 projection_version = 5;
    // Set when the attempt left: processed or processing_timeout.
    string result = 6;
    int32 queue_id = 7;
    int32 agent_id = 8;
    // Unix milliseconds; set while postponed.
    int64 postponed_until = 9;
    bool replayed = 10;
}

message EmailWakeUpRequest {
    int64 domain_id = 1;
    int64 thread_id = 2;
    // The email.message.inbound event; its result is kept and returned again on a replay.
    string email_event_id = 3;
}

message EmailWakeUpResponse {
    enum Result {
        RESULT_UNSPECIFIED = 0;
        // A postponed attempt went back to work with its agent.
        RESULT_WOKEN = 1;
        // A postponed attempt went to the queue: its agent had no slot or was not online.
        RESULT_QUEUED = 2;
        // An attempt in post-processing went back to work.
        RESULT_REOPENED = 3;
        // The active attempt needed no change.
        RESULT_NOOP = 4;
        // The Thread has no active attempt.
        RESULT_NOT_ACTIVE = 5;
    }

    Result result = 1;
    int64 attempt_id = 2;
    string state = 3;
    int64 attempt_version = 4;
    bool replayed = 5;
    // Queue of the last finished Email attempt of the Thread; set only for RESULT_NOT_ACTIVE and kept for a replay.
    optional int32 fallback_queue_id = 6;
}
