syntax = "proto3";
package webitel.im.api.gateway.v1;

import "api/gateway/v1/message.proto";
import "api/gateway/v1/thread_member.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "api/gateway/v1/peer.proto";

option go_package = "github.com/webitel/im-gateway-service/gen/api/gateway/v1;gateway";

// MessageHistory service provides read-only access
// to message history within threads.
service MessageHistory {
  // Searches messages within a specific thread.
  // Supports cursor-based pagination and field selection.
  rpc SearchThreadMessagesHistory(SearchMessageHistoryRequest) returns (SearchMessageHistoryResponse) {
    option (google.api.http) = {get: "/v1/{thread_id}/messages"};
  }

  // Searches messages grouped by the user's closed membership periods
  // within a thread. Active memberships are excluded — their
  // messages are available via SearchThreadMessagesHistory.
  rpc SearchLeftThreadsMessagesHistory(SearchLeftThreadsMessageHistoryRequest) returns (SearchMessageHistoryResponse) {
    option (google.api.http) = {get: "/v1/threads/{thread_id}/left_threads/messages"};
  }

  // Returns the edit and deletion history of a single message, oldest first.
  // Readable by every member of the thread the message belongs to.
  rpc GetMessageRevisions(GetMessageRevisionsRequest) returns (GetMessageRevisionsResponse) {
    option (google.api.http) = {get: "/v1/messages/{message_id}/revisions"};
  }
}

// HistoryMessageCursorResponse defines next/prev id for keyset-pagination.
message HistoryMessageCursorResponse {
  // Unique identifier last message where cursor stopped.
  string id = 1;
}

// HistoryMessageCursorRequest represents a cursor-based pagination request
// for retrieving messages relative to a specific message ID.
//
// This request is used in keyset pagination, where the `id` field acts as a
// cursor pointing to a reference message in the history. The server returns
// messages either before or after this cursor depending on the `before` flag.
//
// Pagination semantics:
//   - The `id` must be a valid UUID of an existing message.
//   - The result set is always ordered consistently (e.g., by creation time).
//   - The `before` flag controls the direction of traversal in the message history.
//
// Direction behavior:
//   - before = true:
//       Fetch messages that come *before* the given message in history
//       (i.e., older messages).
//
//   - before = false:
//       Fetch messages that come *after* the given message
//       (i.e., newer messages, moving toward the present).
//
// Notes:
//   - This approach avoids offset-based pagination issues such as skipping
//     or duplicating records when data changes.
//   - Typically used for chat/message history scrolling.
//   - The number of returned messages is controlled separately (e.g., via limit).
//
message HistoryMessageCursorRequest {
  // Cursor identifier.
  // Must be a valid UUID referencing an existing message.
  // Defines the starting point for pagination.
  string id = 1 [(buf.validate.field).string.uuid = true];

  // Pagination direction flag.
  //
  // true  -> fetch newer messages (back before history)
  // false -> fetch older messages (back to older history)
  bool before = 2;
}

// SearchMessageHistoryRequest defines filtering,
// pagination and projection options for searching
// message history.
message SearchMessageHistoryRequest {
  // List of message fields to be returned.
  // Used to reduce payload size.
  repeated string fields = 1;

  // Filter by specific message IDs.
  repeated string ids = 2 [
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.max_items = 100
  ];

  // Filter by thread IDs.
  string thread_id = 3 [(buf.validate.field).string.uuid = true];

  // Filter messages by sender user IDs.
  repeated string sender_ids = 4 [
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.max_items = 50
  ];

  // Filter messages by message types.
  repeated int32 types = 5 [
    (buf.validate.field).repeated.items.int32.gte = 1,
    (buf.validate.field).repeated.items.int32.lte = 4,
    (buf.validate.field).repeated.max_items = 4
  ];

  // Cursor for cursor-based pagination.
  // If omitted, search starts from the most recent messages.
  optional HistoryMessageCursorRequest cursor = 6;

  // Maximum number of messages to return.
  uint32 size = 7 [
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 100
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Document represents a file attachment
// associated with a message.
message Document {
  // Document identifier.
  int64 id = 1;

  // Identifier of the message this document belongs to.
  string message_id = 2;

  // File storage identifier.
  int64 file_id = 3;

  // Original file name.
  string name = 4;

  // MIME type of the document.
  string mime = 5;

  // File size in bytes.
  int64 size = 6;

  // Creation timestamp (Unix time, milliseconds).
  int64 created_at = 7;

  // Public signed URL for downloading the document.
  string url = 8;
}

// Image represents an image attachment
// associated with a message.
message Image {
  // Image identifier.
  string id = 1;

  // Identifier of the message this message belongs to.
  string message_id = 2;

  // File storage identifier.
  int64 file_id = 3;

  // MIME type of the image.
  string mime = 4;

  // Image width in pixels.
  int32 width = 5;

  // Image height in pixels.
  int32 height = 6;

  // Creation timestamp (Unix time, milliseconds).
  int64 created_at = 7;

  // Public signed URL for accessing the image.
  string url = 8;
}

message ReplyToMessage {
  string id = 1;
  ThreadMember sender = 2;
  string sender_id = 3;
  int32 type = 4;
  string body = 5;
  int64 created_at = 6;
  optional string attachment_kind = 7;
  optional string attachment_name = 8;
  optional string attachment_mime = 9;
}

// ForwardOrigin is a snapshot of the original author taken at forward time.
// Unlike ReplyToMessage it carries no enriched ThreadMember: the original author
// is generally not a member of the chat the copy landed in, so sender_name is
// the only label a client can rely on.
message ForwardOrigin {
  ForwardOriginKind kind = 1;

  // Contact id of the original author. Empty unless kind is INTERNAL.
  string sender_id = 2;

  // Display name of the original author — the "from whom" label.
  string sender_name = 3;

  // When the original message was sent, Unix time in milliseconds.
  int64 original_sent_at = 4;

  // Source message this copy was made from. Empty unless kind is INTERNAL,
  // and cleared if the source is later purged.
  string source_message_id = 5;
}

// MessageRecipientStatus is a per-recipient delivery state of a message.
message MessageRecipientStatus {
  // Recipient contact id.
  string member_id = 1;

  MessageDeliveryStatus status = 2;

  // Unix time in milliseconds; zero when not reached.
  int64 delivered_at = 3;
  int64 read_at = 4;
  int64 failed_at = 5;

  // Confirmation source: ws|push|provider|bot.
  string via = 6;

  // JSON-encoded provider error details for FAILED.
  string error = 7;
}

// HistoryMessage represents a single message
// in thread history.
message HistoryMessage {
  // Unique message identifier.
  string id = 1;

  // Identifier of the thread the message belongs to.
  string thread_id = 2;

  // Sender user aggregated information.
  ThreadMember sender = 3;

  // Message type identifier.
  int32 type = 4;

  // Message body content.
  string body = 5;

  // Arbitrary message metadata.
  // Can contain structured data depending on message type.
  google.protobuf.Struct metadata = 6;

  // Message creation timestamp (Unix time, milliseconds).
  int64 created_at = 7;

  // Message last update timestamp (Unix time, milliseconds).
  int64 edited_at = 8;

  // Per-thread monotonic sequence number, assigned on message creation.
  int64 seq = 24;

  // List of document attachments.
  repeated Document documents = 9;

  // List of image attachments.
  repeated Image images = 10;

  MessageContact contact = 11;
  MessageLocation location = 12;
  Interactive interactive = 13;

  // System message content.
  System system = 14;

  // Metadata for button reaction for interactive message.
  InteractiveCallback reacted_metadata = 15;

  ReplyToMessage reply_to = 16;

  // Aggregated delivery status across recipients: FAILED when every
  // recipient failed, otherwise the minimal status among non-failed ones.
  // UNSPECIFIED for messages without per-recipient tracking (historical).
  MessageDeliveryStatus delivery_status = 17;

  // Per-recipient delivery details.
  repeated MessageRecipientStatus statuses = 18;

  // True when the message was deleted by its author. Every content field
  // (body, attachments, contact, location, interactive, metadata) is cleared,
  // so clients should render a tombstone.
  bool deleted = 19;

  // Unix time in milliseconds when the message was deleted.
  int64 deleted_at = 20;

  // Set when this message is a forward. Never populated for a deleted
  // message: the tombstone must not leak the origin name.
  ForwardOrigin forward_origin = 21;

  // Contact id of the member who deleted the message; empty when it is live.
  string deleted_by = 22;

  // Number of entries in the message's change history. Zero means the message
  // was never edited or deleted; otherwise GetMessageRevisions returns that
  // many entries.
  int32 revision_count = 23;

  // Emoji reactions currently held on the message, aggregated per emoji.
  repeated MessageReaction reactions = 25;
}

// MessageReaction is one emoji aggregate on a history message.
message MessageReaction {
  // Unicode emoji this reaction aggregates.
  string emoji = 1;

  // Number of members currently holding this reaction.
  int32 count = 2;

  // True when the requesting caller is one of the reactors.
  bool reacted_by_me = 3;

  // Capped sample of reactor contact ids (for UI); not necessarily all of them.
  repeated string reactor_ids = 4;

  // Unix time in milliseconds of the most recent reaction with this emoji.
  int64 last_reacted_at = 5;
}

// What happened to a message at one point of its history.
enum MessageRevisionAction {
  MESSAGE_REVISION_ACTION_UNSPECIFIED = 0;

  // The message as it was originally sent.
  MESSAGE_REVISION_ACTION_CREATED = 1;

  // The body was replaced by an edit.
  MESSAGE_REVISION_ACTION_EDITED = 2;

  // The message was deleted.
  MESSAGE_REVISION_ACTION_DELETED = 3;
}

// One entry of a message's change history: what the message read at that
// point, who changed it and when.
message MessageRevision {
  // Position in the history, starting at 1 for the original message.
  int32 version = 1;

  MessageRevisionAction action = 2;

  // Body the message carried after this change. For DELETED it is the text
  // the message still carried when it was removed, so the conversation can be
  // reconstructed even though the timeline only shows a tombstone.
  string body = 3;

  // Contact id of the member who made the change.
  string changed_by = 4;

  // Unix time in milliseconds when the change was made.
  int64 changed_at = 5;
}

message GetMessageRevisionsRequest {
  string message_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetMessageRevisionsResponse {
  // Oldest first. Empty when the message was never edited or deleted.
  repeated MessageRevision items = 1;
}

message InteractiveCallback {
  // User who clicked the button.
  ThreadMember reacted_by = 1 [(buf.validate.field).required = true];

  // Original message ID.
  string in_reply_to = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Button identifier.
  string button_code = 3;

  // Optional callback payload.
  string callback_data = 4;

  // Unix time in milliseconds when callback button was clicked.
  int64 reacted_at = 5;
}

// System represents domain structure for system event messages.
message System {
  // Represents type of the message.
  string type = 1;

  // Represents additional metadata binded into system  message.
  google.protobuf.Struct metadata = 2;

  // ID of message for which system messages is binded.
  string message_id = 3;
}

// SearchMessageHistoryResponse contains
// message history search results and pagination metadata.
message SearchMessageHistoryResponse {
  // List of messages matching the search criteria.
  repeated HistoryMessage items = 1;

  // Cursor that represents position to get older messages (used without 'before' param).
  HistoryMessageCursorResponse next_cursor = 2;

  // Cursor that represents position to get newest messages (used with 'before' param).
  HistoryMessageCursorResponse prev_cursor = 3;
}

// SearchLeftThreadsMessageHistoryRequest defines filtering,
// pagination and projection options for searching message
// history grouped by the user's closed membership periods
// ("dialogs") within a thread.
message SearchLeftThreadsMessageHistoryRequest {
  // List of message fields to be returned.
  // Used to reduce payload size.
  repeated string fields = 1;

  // Filter by thread ID.
  string thread_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];

  // Filter messages by sender user IDs.
  repeated string sender_ids = 3 [
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.max_items = 50
  ];

  // Filter messages by message types.
  repeated int32 types = 4 [
    (buf.validate.field).repeated.items.int32.gte = 1,
    (buf.validate.field).repeated.items.int32.lte = 4,
    (buf.validate.field).repeated.max_items = 4
  ];

  // Inclusive lower bound on the dialog interval (Unix time, milliseconds).
  // Zero means unbounded.
  int64 period_from = 5;

  // Inclusive upper bound on the dialog interval (Unix time, milliseconds).
  // Zero means unbounded.
  int64 period_to = 6;

  // Cursor for cursor-based pagination.
  // If omitted, search starts from the most recent dialog.
  optional HistoryMessageCursorRequest cursor = 7;

  // Maximum number of messages to return.
  uint32 size = 8 [
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 100
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message MessageContact {
  optional string name = 1;
  optional string email = 2;
  optional string phone = 3;
}

message MessageLocation {
  double longitude = 1;
  double latitude = 2;
  optional string address = 3;
  optional string name = 4;
}
