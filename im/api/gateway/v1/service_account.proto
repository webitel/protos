syntax = "proto3";

package webitel.im.api.gateway.v1;

import "api/gateway/v1/authorization.proto";
import "api/gateway/v1/contact.proto";
import "api/gateway/v1/device.proto";
import "api/gateway/v1/device_push.proto";
import "api/gateway/v1/oauth.proto";
import "google/api/annotations.proto";

option go_package = "github.com/webitel/im-gateway-service/gen/api/gateway/v1;gateway";

// End-User Account Service
service Account {
  //
  // --- Notifications --- //
  //
  // registerDevice 	Register device to receive PUSH notifications
  // unregisterDevice 	Deletes a device by its token, stops sending PUSH-notifications to it.
  // getNotifySettings 	Gets current notification settings for a given user/group, from all users/all groups.
  // updateNotifySettings 	Edits notification settings from a given user/group, from all users/all groups.
  // resetNotifySettings 	Resets all notification settings from users and groups.
  //
  // --- Users --- //
  //
  // users.getFullUser 	Returns extended user info by ID.
  // users.getUsers 	Returns basic user info according to their identifiers.
  // contacts.resolvePhone 	Resolve a phone number to get user info, if their privacy settings allow it.

  // // Authorization Request. Part of OAuth flow
  // rpc Auth(AuthRequest) returns (AuthResponse);
  rpc Token(TokenRequest) returns (Authorization) {
    option (google.api.http) = {
      post: "/v1/auth/token"
      body: "*"
      response_body: "*"
    };
  }

  // Inspect current Authorization credentials
  rpc Inspect(InspectRequest) returns (Authorization) {
    option (google.api.http) = {get: "/v1/auth/token"};
  }

  // Logout Device Request
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/v1/auth/logout"};
  }

  // Register device to receive PUSH notifications
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {
    option (google.api.http) = {
      post: "/v1/auth/devices"
      body: "push"
    };
  }

  // Deletes a device by its token, stops sending PUSH-notifications to it.
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse) {
    option (google.api.http) = {
      post: "/v1/auth/devices/unregister"
      body: "push"
    };
  }

  // Returns a paginated list of active authorizations (sessions) for the speicfied account,
  // filtered by provided criteria.
  rpc AccountGetAuthorizations(AccountGetAuthorizationsRequest) returns (AccountGetAuthorizationsResponse);
}

// Request message for retrieving the account`s authorizations.
message AccountGetAuthorizationsRequest {
  // The page number to retrieve.
  int32 page = 1;

  // The number of items to return per page (page size).
  int32 size = 2;

  // The unique identifier of the user session.
  string id = 11;

  //The application identifier (App ID) for which user is binded.
  string app_id = 12;

  // The unique device identifier (Device ID) of the user's terminal.
  string device_id = 13;

  // account.(user).id
  InputContact contact = 14;
}

// Response message containing the list of active authorizations.
message AccountGetAuthorizationsResponse {
  // The list of active authorizations matching the request filters.
  repeated Authorization items = 1;

  // The current page number being returned.
  int32 page = 5;

  // Indicates whether there are more items available on subsequent pages.
  // Returns `true` if a next page exists.
  bool next = 6;
}

// PUSH Subscription
// https://core.telegram.org/api/gateway/push-updates#subscribing-to-notifications
message RegisterDeviceRequest {
  // PUSH Notification subscription
  webitel.im.api.gateway.v1.PUSHSubscription push = 1;
}

message RegisterDeviceResponse {
  // No Reply ; Error status if failed
}

// PUSH Subscription
// https://core.telegram.org/api/gateway/push-updates#subscribing-to-notifications
message UnregisterDeviceRequest {
  // PUSH Notification subscription
  PUSHSubscription push = 1;
}

message UnregisterDeviceResponse {
  // No Reply ; Error status if failed
}

// Composite Reference Key
// [RE]Source ( Issuer / Subject )
message SourceId {
  // REQUIRED. Issuer Identifier for the Issuer of the response.
  // The iss value is a case sensitive URL using the https scheme that contains scheme, host,
  // and optionally, port number and path components and no query or fragment components.
  string iss = 1;
  // REQUIRED. Subject Identifier.
  // A locally unique and never reassigned identifier within the Issuer for the End-User,
  // which is intended to be consumed by the Client, e.g., 24400320 or AItOawmwtWwcT0k51BayewNvutrJUqsvl6qs7A4.
  // It MUST NOT exceed 255 ASCII characters in length.
  // The sub value is a case sensitive string.
  string sub = 2;
}

// InputContact reference for input
message InputContact {
  // int64 dc = 1;
  oneof input {
    // Contact by (internal) subject identifier
    string id = 1;
    // Contact by (external) subject at issuer
    // Composite key: ( sub @ iss )
    SourceId source = 2;
  }
}
