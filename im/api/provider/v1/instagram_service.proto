syntax = "proto3";

package webitel.im.api.provider.v1;

import "google/api/annotations.proto";
import "api/provider/v1/messages.proto";

option go_package = "github.com/webitel/im-provider-service/gen/api/provider/v1;provider";

// InstagramService defines RPC methods for managing Instagram Business Account gateways.
service InstagramService {
  rpc CreateInstagramGate(ProviderCreateInstagramGateRequest) returns (ProviderCreateInstagramGateResponse) {
    option (google.api.http) = { post: "/im/gates/instagram", body: "*" };
  }

  rpc GetInstagramGate(ProviderGetInstagramGateRequest) returns (ProviderGetInstagramGateResponse) {
    option (google.api.http) = { get: "/im/gates/instagram/{id}" };
  }

  rpc UpdateInstagramGate(ProviderUpdateInstagramGateRequest) returns (ProviderUpdateInstagramGateResponse) {
    option (google.api.http) = { patch: "/im/gates/instagram/{id}", body: "*" };
  }

  rpc DeleteInstagramGate(ProviderDeleteInstagramGateRequest) returns (ProviderDeleteInstagramGateResponse) {
    option (google.api.http) = { delete: "/im/gates/instagram/{id}" };
  }
}
