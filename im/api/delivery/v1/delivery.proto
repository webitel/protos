syntax = "proto3";

package webitel.im.api.delivery.v1;

import "google/protobuf/any.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
option go_package = "github.com/webitel/im-delivery-service/gen/api/v1;impb";

//------------------------------------------------------------------------------
// CLIENT REQUESTS
//------------------------------------------------------------------------------

// StreamRequest defines the subscription parameters for the event stream.
message StreamRequest {
  // Cursor for stream resumption after reconnect: the id of the last event the
  // client durably processed. On connect the server replays pending unread
  // (with fresh envelope ids) when this is stale or absent, so the delivered
  // watermark self-heals past the 24h envelope-ref TTL. Empty on a fresh stream.
  string last_event_id = 1;

  /*
   * Reserved for future implementation:
   * 1. repeated EventType allowed_events - Filter for specific event types (MESSAGE, ACK, etc.)
   * 2. PingSettings ping                 - Custom heartbeat intervals.
   * 3. int32 max_in_flight               - Flow control (backpressure) limit.
   */
}

//------------------------------------------------------------------------------
// SERVER EVENTS (TOP-LEVEL)
//------------------------------------------------------------------------------

// ServerEvent is a container for all types of data sent over the delivery stream.
message ServerEvent {
  // Unique identifier for the event. Used for logging, tracing, and deduplication.
  string id = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Unique identifier of the streamed event"
    }
  ];

  // Timestamp of event generation (Unix epoch in milliseconds).
  int64 created_at = 2;

  // Relative importance of the event for client-side processing priority.
  EventPriority priority = 3;

  // Payload contains the specific event data.
  oneof payload {
    // Confirmation of successful stream establishment.
    ConnectedEvent connected_event = 4;
    
    //Notification sent before the server closes the stream.
    DisconnectedEvent disconnected_event = 5;

    // A new incoming message from a chat/thread.
    NewMessageEvent message_event = 6;

    // Acknowledgement of a previously sent message or processed action.
    AckEvent ack_event = 7;

    // Notification about a stream-level or business-logic error.
    ErrorEvent error_event = 8;

    // Heartbeat signal to maintain connection and detect "half-open" sockets.
    PingEvent ping_event = 9;

    // Per-recipient delivery status change of one or more messages.
    MessageStatusEvent message_status_event = 10;

    // A message was deleted by its author and must be removed from the chat.
    MessageDeletedEvent message_deleted_event = 11;

    // Ephemeral "…is typing" indicator (optionally with a live draft preview).
    TypingEvent typing_event = 12;

    // A member set or cleared an emoji reaction on a message.
    MessageReactionEvent message_reaction_event = 13;

    // A message's content was edited by its author and must be replaced.
    MessageEditedEvent message_edited_event = 14;
  }
}

// MessageReactionEvent notifies thread participants that a member set or
// cleared an emoji reaction on a message. Clients match the message by id and
// update its reaction list for the given member.
message MessageReactionEvent {
  // Message the reaction applies to.
  string message_id = 1;

  // Thread the message belongs to.
  string thread_id = 2;

  // Member who reacted.
  Peer reactor = 3;

  // Emoji that was set. Empty when the reaction was cleared.
  string emoji = 4;

  // True when the reaction was removed rather than set.
  bool removed = 5;

  // Unix time in milliseconds when the reaction changed.
  int64 reacted_at = 6;

  // Opaque client echo token from the originating SetReaction call, echoed so
  // the reactor's own devices can reconcile an optimistic update. Empty when
  // the reaction did not originate from a client that supplied one.
  string send_id = 7;
}

// TypingEvent is an ephemeral, real-time "…is typing" indicator.
//
// It is never stored, never pushed and never replayed on reconnect: it is
// delivered only to participants that are online at the moment. Clients show
// the indicator for timeout_ms and self-expire it (no explicit stop event is
// required in the common flow — it is superseded by the message or by TTL).
message TypingEvent {
  // Thread the indicator belongs to.
  string thread_id = 1;

  // (removed) member_id — the typing participant is now the full `member` Peer,
  // identical to a message sender. No duplicated id at the top level.
  reserved 2;
  reserved "member_id";

  // How long to keep the indicator visible, in milliseconds.
  int32 timeout_ms = 3;

  // Live draft of the message being typed (Live Typing Preview).
  //
  // PRIVACY: this is the sender's unsent text. The delivery service attaches it
  // ONLY for sessions whose member is authorized to see the preview (resolved
  // server-side from the ephemeral event's allow-list); it is absent for every
  // other session. Clients MUST NOT log or persist it. The allow-list itself is
  // a server-only concept and is never sent to clients.
  optional string preview_text = 4;

  // Participant who is typing, carrying id and identity (name, etc.).
  // Mirrors the sender structure of NewMessageEvent for consistent client rendering.
  Peer member = 5;
}

// MessageEditedEvent notifies thread participants that a message's content was
// changed by its author. Clients match the message by id and replace its text.
// An edit never changes attachments or reply context, so neither is repeated
// here.
message MessageEditedEvent {
  // Identifier of the edited message.
  string id = 1;

  // Thread the message belongs to.
  string thread_id = 2;

  // Participant who edited the message.
  Peer edited_by = 3;

  // Content after the edit.
  string text = 4;

  // Content type of the message.
  MessageType type = 5;

  // Unix time in milliseconds when the message was originally sent.
  int64 created_at = 6;

  // Unix time in milliseconds when the message was edited.
  int64 edited_at = 7;

  // Position of this body in the message's change history — the version
  // GetMessageRevisions reports for it, so 2 right after the first edit
  // (version 1 is the original text). Clients order concurrent edits by it.
  int32 version = 8;
}

// MessageDeletedEvent notifies thread participants that a message was deleted
// by its author. Clients match the message by id and remove it.
message MessageDeletedEvent {
  // Identifier of the deleted message.
  string id = 1;

  // Thread the message belonged to.
  string thread_id = 2;

  // Participant who deleted the message.
  Peer deleted_by = 3;

  // Unix time in milliseconds when the message was deleted.
  int64 deleted_at = 4;
}

//------------------------------------------------------------------------------
// MESSAGE DELIVERY STATUS
//------------------------------------------------------------------------------

// MessageDeliveryStatus is a per-recipient delivery state of a message.
// Transitions are monotonic: SENT -> DELIVERED -> READ.
// FAILED is terminal but may be superseded by a later DELIVERED (retry).
enum MessageDeliveryStatus {
  MESSAGE_DELIVERY_STATUS_UNSPECIFIED = 0;

  // Accepted by the system and queued for delivery.
  MESSAGE_DELIVERY_STATUS_SENT = 1;

  // Reached the recipient (stream ACK, push, provider receipt, bot dispatch).
  MESSAGE_DELIVERY_STATUS_DELIVERED = 2;

  // Read by the recipient. Not applicable to bots.
  MESSAGE_DELIVERY_STATUS_READ = 3;

  // Delivery failed (provider rejected, invalid contact, channel restriction).
  MESSAGE_DELIVERY_STATUS_FAILED = 4;
}

// MessageStatusEvent notifies thread participants that the delivery status
// of one or more messages changed for a recipient. Read receipts are bulk
// ("read up to"), so a single event may cover multiple messages of the same
// recipient in the same thread.
message MessageStatusEvent {
  // Thread the messages belong to.
  string thread_id = 1;

  // Recipient contact id whose statuses changed.
  string member_id = 2;

  // Messages whose status changed for the recipient.
  repeated string message_ids = 3;

  // The new delivery state.
  MessageDeliveryStatus status = 4;

  // Confirmation source: ws|push|provider|bot.
  string via = 5;

  // JSON-encoded provider error details for FAILED.
  string error = 6;

  // Unix time in milliseconds when the status changed.
  int64 occurred_at = 7;

  // Read/delivered-up-to watermark: the highest message id covered by this
  // status change. A client advances its local peer-horizon in O(1) from this
  // instead of iterating message_ids (which stays populated for older clients).
  string up_to_message_id = 8;

  // Same watermark expressed as the per-thread seq (preferred): the client
  // advances its local peer-horizon to this integer.
  int64 up_to_seq = 9;
}

//------------------------------------------------------------------------------
// EVENT PAYLOAD DETAILS
//------------------------------------------------------------------------------

// ConnectedEvent is the first message sent by the server after the stream is opened.
message ConnectedEvent {
  // Status of the stream initialization.
  bool ok = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Indicates successful stream initialization"
    }
  ];

  // Unique session/connection ID assigned by the server for this stream.
  string connection_id = 2;

  // Current server version. Useful for feature detection and troubleshooting.
  string server_version = 3;
}


// DisconnectedEvent is sent by the server just before forcefully closing the stream.
message DisconnectedEvent {
  // Human-readable explanation of why the connection is being closed.
  string reason = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Human-readable reason for disconnection"
    }
  ];

  // Machine-readable code to help the client decide on reconnection strategy.
  // Examples: "SESSION_EVICTED", "SERVER_SHUTDOWN", "INACTIVITY", "AUTH_EXPIRED".
  string code = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Machine-readable termination code"
    }
  ];
}

// NewMessageEvent contains a message that needs to be delivered to the client.
message NewMessageEvent {
 // The actual message object with content, metadata, and sender info.
 ThreadMessage  message = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Message delivered via the stream",
    }
  ];
}

message ThreadMessage {
    string id = 1;
    string thread_id = 2;
    Peer from = 3;
    Peer to = 4;

    int64 created_at = 5;
    int64 edited_at  = 6;
    string text = 7;
    MessageType type = 8;
    oneof content {
        Document document = 9;
        Image image = 10;
    }

    QuotedMessage reply_to = 11;

    ForwardOrigin forward_origin = 12;
}

message QuotedMessage {
  string id = 1;
  string sender_id = 2;
  string type = 3;
  string body = 4;
  int64 created_at = 5;
  string attachment_kind = 6;
  string attachment_name = 7;
  string attachment_mime = 8;
}

enum ForwardOriginKind {
  FORWARD_ORIGIN_KIND_UNSPECIFIED = 0;

  FORWARD_ORIGIN_KIND_INTERNAL = 1;

  FORWARD_ORIGIN_KIND_EXTERNAL_USER = 2;

  FORWARD_ORIGIN_KIND_EXTERNAL_HIDDEN_USER = 3;

  FORWARD_ORIGIN_KIND_EXTERNAL_CHAT = 4;
}

message ForwardOrigin {
  ForwardOriginKind kind = 1;

  string sender_id = 2;

  string sender_name = 3;

  int64 original_sent_at = 4;

  string source_message_id = 5;
}

message Identity {
  string issuer = 1;
  string name = 2;
}

message Peer {
  // Addressing: mandatory routing identifiers
  oneof kind {
    string user_id    = 1;
    string chat_id    = 2;
    string channel_id = 3;
    string bot_id     = 4;
  }

  // Identity: enriched user data
  Identity identity = 10;
}


enum MessageType {
    // Represents an unspecified or unknown message type.
    UNSPECIFIED_MESSAGE_TYPE = 0;
    // Represents a text message.
    TEXT = 1;
    // Represents a document message.
    DOCUMENT = 2;
    // Represents an image message.
    IMAGE = 3;
}

message Document {
  string id = 1;
  string url = 2;
  string file_name = 3; 
  string mime_type = 4; 
  int64 size_bytes = 5;
}

message Image {
  string id = 1;
  string url = 2;
  string file_name = 3;
  string mime_type = 4;
}

// AckEvent confirms the status of a specific event or message processing on the server.
message AckEvent {
  // Reference to the original event/message ID being acknowledged.
  string id = 1;

  // Result of the operation (Success, Error, etc.).
  Status status = 2;

  // Additional context for the result (e.g., reason for rejection, quota details).
  repeated google.protobuf.Any details = 3;
}

// ErrorEvent communicates issues that occur during the stream's lifetime.
message ErrorEvent {
  // Machine-readable string constant (e.g., "INTERNAL_ERROR", "AUTH_EXPIRED").
  string code = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Machine-readable error code"
    }
  ];

  // Human-readable message explaining the error.
  string message = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Human-readable error message"
    }
  ];

  // Structured error metadata for programmatic handling.
  repeated google.protobuf.Any details = 3 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Additional structured error details"
    }
  ];
}

// PingEvent is used to verify the connection is still active.
message PingEvent {
  // Optional data that the server might include for RTT (Round Trip Time) calculation.
  string echo = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Optional ping payload"
    }
  ];
}

//------------------------------------------------------------------------------
// ENUMERATIONS
//------------------------------------------------------------------------------

// Status defines the outcome of an operation or delivery process.
enum Status {
  // Unspecified or unknown state.
  STATUS_UNSPECIFIED = 0;

  // The operation was successful.
  SUCCESS = 1;

  // A transient error occurred; retrying might resolve the issue.
  TEMPORARY_ERROR = 2;

  // A fatal error occurred; do not retry with the same parameters.
  PERMANENT_ERROR = 3;

  // The request violated business logic or validation rules.
  REJECTED = 4;
}

// EventPriority defines how urgently the client should handle the incoming event.
enum EventPriority {
  // Unspecified priority.
  PRIORITY_UNSPECIFIED = 0;

  // Critical events (New messages, Errors).
  HIGH = 1;

  // Standard events (Acknowledgements).
  NORMAL = 2;

  // Background events (Pings, Statistics).
  LOW = 3;
}