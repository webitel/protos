syntax = "proto3";

package webitel.im.provider.v1;

import "service/provider/v1/enums.proto";

option go_package = "github.com/webitel/im-provider-service/gen/go/api/v1;impb";

// --- Base Entities ---

// ProviderStatusCapabilities declares which delivery-status receipts the
// channel emits. A channel without a capability leaves messages in the last
// reachable state; the UI uses these flags to avoid drawing unreachable
// status marks.
message ProviderStatusCapabilities {
  // The channel emits delivery receipts.
  bool delivered = 1;
  // The channel emits read/seen receipts.
  bool read = 2;
  // The channel reports failed deliveries.
  bool failed = 3;
  // The channel can forward a native "typing…" indicator to the chat partner.
  bool typing = 4;
}

message ProviderSummary {
  string id = 1;
  string name = 2;
  webitel.im.provider.v1.ProviderType type = 3;
  webitel.im.provider.v1.ProviderStatus status = 4;
  string webhook_url = 5;
  string contact = 6;
  string provider_app_id = 7;
  int64 created_at = 8; // Unix timestamp in milliseconds
  int64 updated_at = 9; // Unix timestamp in milliseconds

  // Delivery-status receipts the channel is able to produce; unset when no
  // provider adapter is registered for the channel type.
  ProviderStatusCapabilities capabilities = 10;
}

message ProviderMetaApp {
  string id = 1;
  string name = 2;
  string app_id = 3;
  string verify_token = 5;
  string oauth_redirect_uri = 6;
  repeated string scopes = 7;
  int64 created_at = 8; // Unix timestamp in milliseconds
  int64 updated_at = 9; // Unix timestamp in milliseconds
}

message ProviderFacebookGate {
  string id = 1;
  string name = 2;
  string meta_app_id = 3;
  string page_id = 4;
  string page_name = 5;
  webitel.im.provider.v1.ProviderStatus status = 6;
  int64 created_at = 7; // Unix timestamp in milliseconds
  int64 updated_at = 8; // Unix timestamp in milliseconds
  bool enabled = 9;
}

message ProviderInstagramGate {
  string id = 1;
  string name = 2;
  string meta_app_id = 3;
  string business_account_id = 4;
  webitel.im.provider.v1.ProviderStatus status = 5;
  int64 created_at = 6; // Unix timestamp in milliseconds
  int64 updated_at = 7; // Unix timestamp in milliseconds
  bool enabled = 8;
}

message ProviderWhatsAppGate {
  string id = 1;
  string name = 2;
  string meta_app_id = 3;
  string waba_id = 4;
  string phone_number_id = 5;
  string phone_display = 6;
  webitel.im.provider.v1.ProviderStatus status = 8;
  int64 created_at = 9; // Unix timestamp in milliseconds
  int64 updated_at = 10; // Unix timestamp in milliseconds
}

message ProviderViberGate {
  string id = 1;
  string name = 2;
  string bot_id = 3; 
  string bot_uri = 4; 
  string sender_name = 5;
  string sender_avatar = 6;
  string webhook_url = 7;
  webitel.im.provider.v1.ProviderStatus status = 8;
  int64 created_at = 9; // Unix timestamp in milliseconds
  int64 updated_at = 10; // Unix timestamp in milliseconds
  bool enabled = 11;
}
message ProviderTelegramBotGate {
  string id = 1;
  string name = 2;
  string uri = 3;
  webitel.im.provider.v1.ProviderStatus status = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}
