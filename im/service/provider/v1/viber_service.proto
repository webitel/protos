syntax = "proto3";

package webitel.im.provider.v1;

import "google/api/annotations.proto";
import "service/provider/v1/entities.proto";
import "service/provider/v1/messages.proto";

option go_package = "github.com/webitel/im-provider-service/gen/go/api/v1;impb";

/// ViberService defines the RPC methods for managing Viber bot gateways.
service ViberService {
  /// CreateViberGate registers a Viber bot as a messaging gateway.
  rpc CreateViberGate (webitel.im.provider.v1.ProviderCreateViberGateRequest) returns (webitel.im.provider.v1.ProviderCreateViberGateResponse) {
    option (google.api.http) = { post: "/im/gates/viber", body: "*" };
  }

  /// GetViberGate retrieves configuration and status for a Viber gateway.
  rpc GetViberGate (webitel.im.provider.v1.ProviderGetViberGateRequest) returns (webitel.im.provider.v1.ProviderGetViberGateResponse) {
    option (google.api.http) = { get: "/im/gates/viber/{id}" };
  }

  /// UpdateViberGate updates Viber gateway settings.
  rpc UpdateViberGate (webitel.im.provider.v1.ProviderUpdateViberGateRequest) returns (webitel.im.provider.v1.ProviderUpdateViberGateResponse) {
    option (google.api.http) = { patch: "/im/gates/viber/{id}", body: "*" };
  }

  /// DeleteViberGate removes the Viber gateway integration.
  rpc DeleteViberGate (webitel.im.provider.v1.ProviderDeleteViberGateRequest) returns (webitel.im.provider.v1.ProviderDeleteViberGateResponse) {
    option (google.api.http) = { delete: "/im/gates/viber/{id}" };
  }
}
