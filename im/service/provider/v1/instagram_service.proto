syntax = "proto3";

package webitel.im.provider.v1;

import "google/api/annotations.proto";
import "service/provider/v1/entities.proto";
import "service/provider/v1/messages.proto";

option go_package = "github.com/webitel/im-provider-service/gen/go/api/v1;impb";

/// InstagramService defines the RPC methods for managing Instagram Business Account gateways.
service InstagramService {
  /// CreateInstagramGate activates an Instagram Business Account gateway.
  rpc CreateInstagramGate (webitel.im.provider.v1.ProviderCreateInstagramGateRequest) returns (webitel.im.provider.v1.ProviderCreateInstagramGateResponse) {
    option (google.api.http) = { post: "/im/gates/instagram", body: "*" };
  }

  /// GetInstagramGate retrieves details of a specific Instagram gateway.
  rpc GetInstagramGate (webitel.im.provider.v1.ProviderGetInstagramGateRequest) returns (webitel.im.provider.v1.ProviderGetInstagramGateResponse) {
    option (google.api.http) = { get: "/im/gates/instagram/{id}" };
  }

  /// UpdateInstagramGate modifies Instagram gateway settings.
  rpc UpdateInstagramGate (webitel.im.provider.v1.ProviderUpdateInstagramGateRequest) returns (webitel.im.provider.v1.ProviderUpdateInstagramGateResponse) {
    option (google.api.http) = { patch: "/im/gates/instagram/{id}", body: "*" };
  }

  /// DeleteInstagramGate deactivates the gateway.
  rpc DeleteInstagramGate (webitel.im.provider.v1.ProviderDeleteInstagramGateRequest) returns (webitel.im.provider.v1.ProviderDeleteInstagramGateResponse) {
    option (google.api.http) = { delete: "/im/gates/instagram/{id}" };
  }
}
