syntax = "proto3";

package webitel.im.service.thread.v1;
import "buf/validate/validate.proto";

option go_package = "github.com/webitel/protos/messaging/thread/v1;impb";

message Identity {
  string issuer = 1;
  // name is the real name, used everywhere inside Webitel (history, reports).
  string name = 2;
  // Deprecated: use via_ref.id. Kept for clients that still send only the gate id.
  optional string via = 3 [deprecated = true];
  // chat_name is the name external clients see instead of the real one. Empty means
  // "no separate public name" — channels then fall back to their own default.
  string chat_name = 4;
  // Gate the identity came through, with its display data. Optional.
  Via via_ref = 5;
}

// Via is the gate (im-providers) a message came through.
message Via {
  // Gate id.
  string id = 1;
  // Gate display name.
  string name = 2;
  // Provider type, e.g. facebook | whatsapp | telegram_bot.
  string type = 3;
}

// Represents a peer in the messaging system.
// It can be a user, chat, or channel.
message Peer {
  oneof kind {
    // Contact identifier [direct thread]
    string contact_id    = 1[
      (buf.validate.field).string.uuid = true
    ];
    // Chat group Id [group thread]
    string group_id    = 2[
      (buf.validate.field).string.uuid = true
    ];
    // Channel Id [channel thread]
    string channel_id = 3[
      (buf.validate.field).string.uuid = true
    ];

    // Thread ID
    string thread_id = 4[
      (buf.validate.field).string.uuid = true
    ];
  }
  Identity identity = 5;
}
