syntax = "proto3";

package webitel.im.service.thread.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "service/thread/v1/peer.proto";

option go_package = "github.com/webitel/im-thread-service/gen/go/api/v1;impb";

// The Message service entity provides methods for sending messages to a specified recipient [peer].
service Message {
  // Sends a text message to a specified recipient [peer].
  rpc SendText(SendTextRequest) returns (SendTextResponse);

  // Sends a document message to a specified recipient [peer].
  // This method sends a document message to the recipient [peer] specified in the request.
  // The document can be uploaded as a internal file via id or provided as a URL.
  rpc SendDocument(SendDocumentRequest) returns (SendDocumentResponse);

  // Mark message as read by id.
  rpc Read(ReadMessageRequest) returns (ReadMessageResponse);

  // Sends an interactive message (buttons, lists, CTA).
  // Supports idempotency via send_id.
  rpc SendInteractive(SendInteractiveMessageRequest) returns (SendMessageResponse);

  // Handles user interaction callbacks.
  // Should be called by client when user interacts with UI.
  rpc SendInteractiveCallback(InteractiveCallbackRequest) returns (InteractiveCallbackResponse);

  // Sends a geographic location message.
  rpc SendLocation(SendLocationRequest) returns (SendMessageResponse);

  // Sends a contact card.
  rpc SendContact(SendContactRequest) returns (SendMessageResponse);

  // Sends a system message (e.g., "User X joined the chat").
  rpc SendSystemMessage(SendSystemMessageRequest) returns (SendMessageResponse);

  // Edits a previously sent message.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);

  // Soft-deletes messages authored by the caller in threads the caller is
  // still a member of. Best-effort: unremovable ids come back as skipped.
  rpc DeleteMessages(DeleteMessagesRequest) returns (DeleteMessagesResponse);

  // Copies messages the caller can read into a direct thread with [to],
  // stamping each copy with the original author. Best-effort: sources that are
  // missing, unreadable or unforwardable come back as skipped.
  rpc ForwardMessages(ForwardMessagesRequest) returns (ForwardMessagesResponse);
  
  // Sets or clears the caller's emoji reaction on a single message.
  //
  // A member may hold at most one reaction per message: a new emoji replaces
  // the previous one, sending the same emoji again clears it (toggle), and an
  // empty emoji clears it explicitly. The call is idempotent (send_id) and
  // serves both webitel participants and inbound reactions relayed from an
  // external messenger. Whether a reaction is forwarded to the far side
  // depends on the messenger's capabilities.
  rpc SetReaction(SetReactionRequest) returns (SetReactionResponse);

  // Sends an ephemeral typing indicator to the other participants of a thread.
  //
  // The event is real-time only: it is published fire-and-forget (it never
  // touches the transactional outbox), is delivered only to currently online
  // participants, is never stored in history and never triggers a push.
  //
  // The same RPC serves humans (no timeout_ms) and bots (custom timeout_ms,
  // e.g. to hold the indicator while an answer is generated). When preview_text
  // is provided the client draft is forwarded to authorized (operator /
  // supervisor) recipients only; this is gated by a server-side feature flag
  // and is silently dropped when the flag is disabled.
  rpc SendTyping(SendTypingRequest) returns (SendTypingResponse);
}

// ForwardOriginKind tells the client how to label a forwarded message and
// whether the origin points at anything addressable inside Webitel.
enum ForwardOriginKind {
  FORWARD_ORIGIN_KIND_UNSPECIFIED = 0;

  // Forwarded inside Webitel: sender_id and source_message_id are set.
  FORWARD_ORIGIN_KIND_INTERNAL = 1;

  // Forwarded into the chat from an external messenger, author named.
  FORWARD_ORIGIN_KIND_EXTERNAL_USER = 2;

  // Same, but the author chose to hide their account, so there is no name.
  FORWARD_ORIGIN_KIND_EXTERNAL_HIDDEN_USER = 3;

  // Origin is an external group or channel rather than a person.
  FORWARD_ORIGIN_KIND_EXTERNAL_CHAT = 4;
}

// ForwardOriginInput carries what an external channel told us about the
// original author of an inbound forwarded message. Providers fill only the
// fields their platform actually exposes.
message ForwardOriginInput {
  ForwardOriginKind kind = 1 [(buf.validate.field).enum.defined_only = true];

  // Display name of the original author. Empty when the platform hides it.
  string sender_name = 2;

  // When the message was originally sent, Unix time in milliseconds.
  // Zero when the platform does not report it.
  int64 original_sent_at = 3;
}

message ForwardMessagesRequest {
  // Operator performing the forward.
  Peer from = 1 [(buf.validate.field).required = true];

  // Recipient of the copies: a user contact or a bot contact (flow schema).
  Peer to = 2 [(buf.validate.field).required = true];

  // Sources to copy, in the order they should appear at the destination.
  repeated string message_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
    items: {
      string: {uuid: true}
    }
  }];

  int32 domain_id = 4;

  optional string send_as = 5;

  string send_id = 20; // optional client-generated id for deduplication
}

message ForwardMessagesResponse {
  // Direct thread the copies landed in.
  string thread_id = 1;

  // Ids of the created copies, in forwarded order.
  repeated string ids = 2;

  // Sources that were not forwarded: unknown id, no read access to the source
  // thread, already deleted, or a type that cannot be forwarded.
  repeated string skipped_ids = 3;
}

// SendTypingRequest carries an ephemeral typing indicator for a thread.
message SendTypingRequest {
  // Participant who is typing.
  Peer from = 1 [(buf.validate.field).required = true];

  // Target thread. Use the Peer.thread_id variant.
  Peer to = 2 [(buf.validate.field).required = true];

  // Domain ID for multi-tenant isolation.
  int64 domain_id = 3;

  // How long clients should keep the indicator visible, in milliseconds.
  // Optional; the server defaults it (typically 6000) and clamps it to 30000.
  // Bots may use higher values to hold the indicator over long operations.
  optional int32 timeout_ms = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 30000
  }];

  // Optional live draft of the message being typed (Live Typing Preview).
  // Forwarded only to authorized recipients and only when the preview feature
  // is enabled. Max 1024 bytes; the server truncates on a rune boundary.
  // An empty value clears a previously shown preview.
  optional string preview_text = 5 [(buf.validate.field).string.max_bytes = 1024];
}

// SendTypingResponse is intentionally empty: typing is fire-and-forget.
message SendTypingResponse {}

message ReadMessageRequest {
  string id = 1;
  string user_id = 2;
  string thread_id = 3;
  int32 domain_id = 4;
}

message ReadMessageResponse {}

message SendTextRequest {
  Peer from = 1;
  Peer to = 2;
  string body = 3;
  int64 domain_id = 4;
  optional string send_as = 5;

  optional string reply_to_message_id = 6 [(buf.validate.field).string.uuid = true];

  string send_id = 20; // optional client-generated id for deduplication

  string external_id = 21;

  string reply_to_external_id = 22;

  // Set when the channel reports this message was forwarded to us.
  optional ForwardOriginInput forward_origin = 23;
}

// Represents a response to send a text message.
message SendTextResponse {
  Peer to = 1;
  string id = 2;
}

// Represents `Document` message with necessary fields
// to process it into frequently used `document`
// entity in messaging systems.
message DocumentInput {
  string id = 1;
  string url = 2;
  string file_name = 3;
  string mime_type = 4;
  optional int64 size_bytes = 5;
}

// Represents a request to send a message with document.
message SendDocumentRequest {
  Peer from = 1;
  Peer to = 2;
  repeated DocumentInput documents = 3;
  string body = 4;
  int64 domain_id = 5;
  optional string send_as = 6;

  optional string reply_to_message_id = 7 [(buf.validate.field).string.uuid = true];

  string send_id = 20; // optional client-generated id for deduplication

  string external_id = 21;

  string reply_to_external_id = 22;

  // Set when the channel reports this message was forwarded to us.
  optional ForwardOriginInput forward_origin = 23;
}

// Represents a response to send message with document.
message SendDocumentResponse {
  Peer to = 1;
  string id = 2;
}

// Represents `Image` entity with
// necessary fields.
message ImageInput {
  string id = 1;
  string name = 2;
  string link = 3;
  string mime_type = 4;
}

// SendMessageResponse represents the result of a send operation.
// Contains the generated message ID and list of recipients.
message SendMessageResponse {
  // List of recipients of the message.
  repeated Peer to = 1;

  // Unique message identifier.
  string id = 2;
}

// SendLocationRequest sends a geographic location message.
message SendLocationRequest {
  // Sender of the message.
  Peer from = 1 [(buf.validate.field).required = true];

  // Recipient of the message.
  Peer to = 2 [(buf.validate.field).required = true];

  // Latitude in degrees. Must be between -90 and +90.
  double latitude = 3 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];

  // Longitude in degrees. Must be between -180 and +180.
  double longitude = 4 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];

  // Optional location name (e.g., "Central Park").
  optional string name = 5;

  // Optional human-readable address.
  optional string address = 6;

  // Arbitrary metadata.
  google.protobuf.Struct metadata = 7;

  // Optional send ID for idempotency.
  string send_id = 8;

  // Domain ID for multi-tenant isolation.
  int32 domain_id = 9;

  optional string send_as = 10;

  optional string reply_to_message_id = 11 [(buf.validate.field).string.uuid = true];

  // Set when the channel reports this message was forwarded to us.
  optional ForwardOriginInput forward_origin = 12;
}

// SendContactRequest sends contact information.
message SendContactRequest {
  // Sender of the message.
  Peer from = 1 [(buf.validate.field).required = true];

  // Recipient of the message.
  Peer to = 2 [(buf.validate.field).required = true];

  // Full name of the contact.
  optional string name = 3;

  // Email must be valid if provided.
  optional string email = 4 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];

  // Phone number in E.164 format recommended.
  optional string phone_number = 5;

  // Arbitrary metadata.
  google.protobuf.Struct metadata = 6;

  // Optional send ID for idempotency.
  string send_id = 8;

  // Domain ID for multi-tenant isolation.
  int32 domain_id = 9;

  optional string send_as = 10;

  optional string reply_to_message_id = 11 [(buf.validate.field).string.uuid = true];

  // Set when the channel reports this message was forwarded to us.
  optional ForwardOriginInput forward_origin = 12;
}

message SendSystemMessageRequest {
  // Sender of the message.
  Peer from = 1 [(buf.validate.field).required = true];

  // Recipient of the message.
  Peer to = 2 [(buf.validate.field).required = true];

  // System message type (e.g., "user_joined", "user_left").
  string type = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // System message content (e.g., "User X joined the chat").
  string body = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // Arbitrary metadata.
  google.protobuf.Struct metadata = 5;

  // Optional send ID for idempotency.
  string send_id = 6;

  // Domain ID for multi-tenant isolation.
  int32 domain_id = 7;

  optional string send_as = 8;
}

// SendInteractiveMessageRequest sends a structured interactive message.
message SendInteractiveMessageRequest {
  // Sender of the message.
  Peer from = 1;

  // Recipient of the message.
  Peer to = 2;

  // Optional idempotency key for deduplication.
  optional string send_id = 3;

  // Interactive payload.
  Interactive interactive = 4;

  // Body text for the message.
  optional string body = 5;

  // Arbitrary metadata.
  google.protobuf.Struct metadata = 6;

  // Domain ID for multi-tenant isolation.
  int32 domain_id = 7;

  optional string send_as = 8;
}

// Interactive represents a rich message with UI elements.
message Interactive {
  // Optional header content.
  oneof attachments {
    // Document attachments header.
    Documents documents = 1;

    // Images attachment header.
    Images images = 2;
  }

  // Force to block user keyboard.
  bool single_use = 3;

  // Interaction type.
  oneof kind {
    // Markup matrix with buttons.
    KeyboardMarkup markup = 4;

    // List reply with main list button text and sections with buttons.
    KeyboardListReply list_reply = 5;
  }
}

// Media container for images attachments.
message Images {
  // Images to be attached to the header of interactive message.
  // Max allowed images: 10.
  repeated ImageInput images = 1 [(buf.validate.field).repeated = {max_items: 10}];
}

// Media container for documents attachments.
message Documents {
  // Documents to be attached to the header of interactive message.
  // Max allowed documents: 10.
  repeated DocumentInput documents = 1 [(buf.validate.field).repeated = {max_items: 10}];
}

// List-style interactive menu.
message KeyboardListReply {
  // Title of the main button, that on-click show up list.
  string main_button_title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // List with sections with buttons.
  repeated KeyboardRowWithSection sections = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// Grid-style buttons.
message KeyboardMarkup {
  // Rows of buttons matrix.
  repeated KeyboardRow rows = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// Represents a row of buttons grouped under a specific logical section header.
// Useful for creating categorized menus or structured interactive interfaces.
message KeyboardRowWithSection {
  // The header text for this section. Must be concise and descriptive.
  string section = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // Collection of buttons within this section.
  // Minimum of 1 button is required to prevent empty sections.
  repeated KeyboardButton buttons = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// A standard horizontal row of interactive buttons without a section header.
message KeyboardRow {
  // Horizontal collection of buttons.
  // Capped at 10 to ensure UI responsiveness and prevent overflow.
  repeated KeyboardButton buttons = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// Defines a single interactive element within the keyboard.
// Each button must have a unique identifier and a specific action type.
message KeyboardButton {
  // Unique idempotent identifier for the button.
  // Used by the frontend to track state and prevent duplicate interactions.
  string id = 1;

  // The human-readable label displayed on the button.
  string label = 2;

  // Polymorphic definition of the button's behavior.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // Directs the user to an external web resource.
    KeyboardButtonURL url = 3;

    // Triggers a backend event (callback) with associated metadata.
    KeyboardButtonCallback callback = 4;

    // Requests sensitive information from the client (e.g., location or contact).
    KeyboardButtonRequest request = 5;
  }

  // Extensible metadata for UI/UX styling (e.g., "color", "theme", "size").
  // Usage: Allows for future-proofing without breaking schema changes.
  google.protobuf.Struct metadata = 6;
}

// Action: Navigates the user to a specific URI.
message KeyboardButtonURL {
  // Must be a valid absolute URI (e.g., https://example.com).
  string url = 1 [(buf.validate.field).string.uri = true];
}

// Action: Sends an asynchronous signal to the backend service.
message KeyboardButtonCallback {
  // Opaque data payload passed back to the server upon interaction.
  string data = 1;
}

// Action: Prompts the client to share specific device data.
message KeyboardButtonRequest {
  // The specific action to be performed by the client application.
  string action = 1;
}

// Client sends callback event when user clicks a button.
message InteractiveCallbackRequest {
  // User who clicked the button.
  Peer reacted_by = 1 [(buf.validate.field).required = true];

  // Original message ID.
  string in_reply_to = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Button identifier.
  string button_code = 3;

  // Optional callback payload.
  string callback_data = 4;
}

// Response sent back to the client after a button click.
message InteractiveCallbackResponse {
  // User who clicked the button.
  Peer reacted_by = 1 [(buf.validate.field).required = true];

  // Original message ID.
  string in_reply_to = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Button identifier.
  string button_code = 3;

  // Optional callback payload.
  string callback_data = 4;

  // Unix time in milliseconds when callback button was clicked.
  int64 reacted_at = 5;
}

message EditMessageRequest {
  // User who edits the message.
  Peer edited_by = 1 [(buf.validate.field).required = true];

  // Original message ID.
  string id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // New message body.
  string body = 3;
}

message EditMessageResponse {
  // Original message ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Unix time in milliseconds when the message was edited.
  int64 edited_at = 2;
}

message DeleteMessagesRequest {
  // User who deletes the messages.
  Peer deleted_by = 1 [(buf.validate.field).required = true];

  // Messages to delete.
  repeated string ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

message DeleteMessagesResponse {
  // Messages that were actually deleted by this call.
  repeated string deleted_ids = 1;

  // Requested messages left untouched: not found, already deleted,
  // not authored by the caller, or the chat is closed.
  repeated string skipped_ids = 2;

  // Unix time in milliseconds when the messages were deleted.
  int64 deleted_at = 3;
}

// The outcome of a SetReaction call, relative to the reaction the caller
// previously held on the message.
enum ReactionAction {
  REACTION_ACTION_UNSPECIFIED = 0;

  // The caller's reaction was created or changed to the requested emoji.
  REACTION_ACTION_SET = 1;

  // The caller's reaction was cleared (toggle off or empty emoji).
  REACTION_ACTION_REMOVED = 2;

  // The stored state already matched the request; nothing changed.
  REACTION_ACTION_UNCHANGED = 3;
}

// ReactionContent is what a reaction carries. It is a union so the contract can
// grow to custom (sticker-backed) emoji without a breaking change; today only
// the unicode `emoji` arm is implemented — `custom_emoji_id` is reserved and
// rejected by the server.
message ReactionContent {
  oneof kind {
    // A single unicode emoji (grapheme). An empty request-level reaction (unset
    // oneof) clears the caller's reaction.
    string emoji = 1 [(buf.validate.field).string.max_bytes = 64];

    // Reserved for messenger/custom (sticker-backed) emoji, referenced by id.
    // Not yet implemented.
    string custom_emoji_id = 2;
  }
}

message SetReactionRequest {
  // Member leaving the reaction (operator, client, or a bot on their behalf).
  Peer reactor = 1 [(buf.validate.field).required = true];

  // Message being reacted to.
  string message_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Reaction to set. Leave unset (or emoji="") to clear the caller's reaction.
  ReactionContent reaction = 3;

  // Domain ID for multi-tenant isolation.
  int64 domain_id = 4;

  // Optional target thread; resolved from the message when omitted.
  optional string thread_id = 5 [(buf.validate.field).string.uuid = true];

  // Optional client-generated id for deduplication.
  string send_id = 20;

  // Optional external message id for reactions relayed from a messenger.
  string external_id = 21;
}

message SetReactionResponse {
  // What the call did relative to the caller's previous reaction.
  ReactionAction action = 1;

  // The reaction now stored for the caller; empty when it was removed.
  ReactionContent reaction = 2;

  // Unix time in milliseconds when the reaction was set; zero when removed.
  int64 reacted_at = 3;
}