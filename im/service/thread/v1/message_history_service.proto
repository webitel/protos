syntax = "proto3";
package webitel.im.service.thread.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "service/thread/v1/message_service.proto";
import "service/thread/v1/peer.proto";
import "service/thread/v1/shared.proto";

option go_package = "github.com/webitel/im-thread-service/gen/go/api/v1;impb";

// The MessageHistory service provides methods for working with messages history.
service MessageHistory {
  // Search for messages in a thread.
  rpc SearchThreadMessagesHistory(SearchMessageHistoryRequest) returns (SearchMessageHistoryResponse);

  rpc SearchLeftThreadsMessageHistory(SearchLeftThreadsMessageHistoryRequest) returns (SearchMessageHistoryResponse);
}

message HistoryMessageCursorResponse {
  string id = 1;
}

message HistoryMessageCursorRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];

  bool before = 2;
}

message SearchMessageHistoryRequest {
  repeated string fields = 1;

  repeated string ids = 2;
  string thread_id = 3;
  repeated string sender_ids = 4;
  repeated int32 types = 5;
  int32 domain_id = 6;

  optional HistoryMessageCursorRequest cursor = 7;
  uint32 size = 8;
  string caller_id = 9;

  // Allow-list of Message.System.Type subtype values (e.g. "user_joined",
  // "user_left") to include in results.
  //  - unset                              : no restriction, all system
  //    messages visible (back-compat default).
  //  - set, with an empty `types` list     : hide ALL system messages.
  //  - set, with a non-empty `types` list  : show ONLY system messages whose
  //    subtype is in this list; every other subtype is hidden, including any
  //    not yet known to the caller (fail-closed for unknown/future
  //    subtypes).
  // Mirrors im-account-service's Application.allow_system_messages 1:1, so a
  // caller (im-gateway-service) can forward that resolved policy value
  // through unchanged. Independent of, and AND-combined with, the coarse
  // `types` (int32) filter above.
  optional SystemMessageAllowList system_message_allow_list = 10;
}

// Looks for messages whose body contains the given text. Results are ordered
// newest first and every item carries its thread_id, so a caller can open the
// dialog and re-enter the history at the matched message.
message SearchMessagesRequest {
  repeated string fields = 1;

  // Text to look for. Matched case-insensitively against any part of the body.
  string q = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];

  // Narrows the search to a single dialog. Empty spans every thread the caller
  // is a member of.
  string thread_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  repeated string sender_ids = 4 [
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.max_items = 50
  ];

  repeated int32 types = 5;

  int32 domain_id = 6;

  // Member running the search. Results never leave the threads this member
  // belongs to, bounded by the periods of their membership.
  string caller_id = 7 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];

  optional HistoryMessageCursorRequest cursor = 8;

  uint32 size = 9 [
    (buf.validate.field).uint32 = {lte: 100},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Allow-list of Message.System.Type subtype values (e.g. "user_joined",
  // "user_left") to include in results.
  //  - unset                              : no restriction, all system
  //    messages visible (back-compat default).
  //  - set, with an empty `types` list     : hide ALL system messages.
  //  - set, with a non-empty `types` list  : show ONLY system messages whose
  //    subtype is in this list; every other subtype is hidden, including any
  //    not yet known to the caller (fail-closed for unknown/future
  //    subtypes).
  // Mirrors im-account-service's Application.allow_system_messages 1:1, so a
  // caller (im-gateway-service) can forward that resolved policy value
  // through unchanged. Independent of, and AND-combined with, the coarse
  // `types` (int32) filter above.
  optional SystemMessageAllowList system_message_allow_list = 10;
}

message Document {
  string id = 1;
  string message_id = 2;
  int64 file_id = 3;
  string name = 4;
  string mime = 5;
  int64 size = 6;
  int64 created_at = 7;
  string url = 8;
}

message Image {
  string id = 1;
  string message_id = 2;
  int64 file_id = 3;
  string mime = 4;
  int32 width = 5;
  int32 height = 6;
  int64 created_at = 7;
  string url = 8;
}

message Location {
  string message_id = 1;
  double latitude = 2;
  double longitude = 3;
  optional string name = 4;
  optional string address = 5;
}

message Contact {
  optional string name = 1;
  optional string email = 2;
  optional string phone_number = 3;
  string message_id = 4;
}

message System {
  string type = 1;
  google.protobuf.Struct metadata = 2;
  string message_id = 3;
}

// SystemMessageAllowList is im-thread-service's per-request policy for which
// "system" message subtypes (Message.System.Type, e.g. "user_joined",
// "user_left") are included in history results. Mirrors im-account-service's
// Application.allow_system_messages 1:1 (see
// im/service/admin/v1/application.proto) so im-gateway-service can forward an
// already-resolved policy value through without any transformation. Wrapped
// in its own message (rather than a bare `repeated string`) so field
// presence can distinguish "not restricted" (the field itself unset) from
// "restricted to allow nothing" (field set, `types` empty) -- a plain
// repeated scalar field cannot represent that distinction, since an absent
// and an explicitly-empty repeated field are indistinguishable on the wire.
message SystemMessageAllowList {
  // Allow-listed Message.System.Type subtype values (e.g. "user_joined",
  // "user_left"). Empty means block ALL system-type messages.
  repeated string types = 1;
}

message ReplyToMessage {
  string id = 1;
  string sender_id = 2;
  int32 type = 3;
  string body = 4;
  int64 created_at = 5;
  optional string attachment_kind = 6;
  optional string attachment_name = 7;
  optional string attachment_mime = 8;
}

message HistoryMessage {
  string id = 1;
  string thread_id = 2;
  string sender_id = 3;
  int32 type = 5;
  string body = 6;
  google.protobuf.Struct metadata = 7;

  int64 created_at = 8;
  int64 updated_at = 9;

  repeated Document documents = 10;
  repeated Image images = 11;
  Location location = 12;
  Contact contact = 13;
  System system = 14;
  Interactive interactive = 15;
  InteractiveCallback reacted_metadata = 16;

  ReplyToMessage reply_to = 17;
}

message SearchMessageHistoryResponse {
  repeated HistoryMessage items = 1;
  repeated ThreadMember from = 2;

  HistoryMessageCursorResponse next_cursor = 3;
  HistoryMessageCursorResponse prev_cursor = 4;
}

// Retrieves message history grouped by the user's closed membership periods
// ("dialogs") within a thread. Active memberships are excluded — their
// messages are available via SearchThreadMessagesHistory.
message SearchLeftThreadsMessageHistoryRequest {
  string thread_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];

  int32 domain_id = 2;

  repeated string sender_ids = 4;
  repeated int32 types = 5;

  // Inclusive bounds on the dialog interval (epoch ms). Zero means unbounded.
  int64 period_from = 6;
  int64 period_to = 7;

  repeated string fields = 8;

  optional HistoryMessageCursorRequest cursor = 9;

  uint32 size = 10 [
    (buf.validate.field).uint32 = {lte: 100},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Allow-list of Message.System.Type subtype values (e.g. "user_joined",
  // "user_left") to include in results.
  //  - unset                              : no restriction, all system
  //    messages visible (back-compat default).
  //  - set, with an empty `types` list     : hide ALL system messages.
  //  - set, with a non-empty `types` list  : show ONLY system messages whose
  //    subtype is in this list; every other subtype is hidden, including any
  //    not yet known to the caller (fail-closed for unknown/future
  //    subtypes).
  // Mirrors im-account-service's Application.allow_system_messages 1:1, so a
  // caller (im-gateway-service) can forward that resolved policy value
  // through unchanged. Independent of, and AND-combined with, the coarse
  // `types` (int32) filter above.
  optional SystemMessageAllowList system_message_allow_list = 11;
}

message InteractiveCallback {
  string reacted_by = 1;
  string in_reply_to = 2;
  string button_code = 3;
  string callback_data = 4;
  int64 reacted_at = 5;
}
